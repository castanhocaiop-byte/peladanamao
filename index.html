<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Série B — Aceoma</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* ── tokens (dark-only design) ─────────────────────────────── */
:root {
  --bg:      #0d1117;
  --s0:      #161b22;
  --s1:      #1c2333;
  --s2:      #21262d;
  --border:  #30363d;
  --border2: #21262d;
  --text:    #e6edf3;
  --text2:   #8b949e;
  --text3:   #6e7681;
  --accent:  #00d67f;
  --gold:    #f0a500;
  --danger:  #f85149;
  --nav-h:   62px;
  --hdr-h:   52px;
  --r:       12px;
  --r-sm:    8px;
}

/* ── reset ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* ── shell ─────────────────────────────────────────────────── */
#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

header {
  position: sticky; top: 0; z-index: 50;
  height: var(--hdr-h);
  background: var(--s0);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 10px;
}
.hdr-logo { font-size: 22px; }
.hdr-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.hdr-sub { font-size: 11px; color: var(--text3); }

main {
  flex: 1;
  padding: 14px 14px calc(var(--nav-h) + 14px);
  overflow-y: auto;
}

nav {
  position: fixed;
  bottom: 0;
  left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 520px;
  height: var(--nav-h);
  background: var(--s0);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-btn {
  flex: 1; background: none; border: none;
  color: var(--text3); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 10px; font-weight: 600;
  letter-spacing: 0.2px; transition: color .15s;
}
.nav-btn .ni { font-size: 20px; line-height: 1; }
.nav-btn.active { color: var(--accent); }

/* ── cards ─────────────────────────────────────────────────── */
.card {
  background: var(--s0);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 10px;
  overflow: hidden;
}
.card-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border2);
}
.card-lbl {
  font-size: 11px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; color: var(--text2);
}
.card-body { padding: 12px 14px; }

/* ── chip ──────────────────────────────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 20px;
  font-size: 12px; font-weight: 600; border: 1px solid;
}

/* ── section label ─────────────────────────────────────────── */
.sec-lbl {
  font-size: 11px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; color: var(--text3);
  padding: 14px 0 6px;
}

/* ── buttons ───────────────────────────────────────────────── */
.btn {
  display: block; width: 100%;
  padding: 13px 16px; border-radius: var(--r-sm);
  border: none; font-family: inherit; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity .15s, transform .1s;
  margin-top: 8px; text-align: center;
}
.btn:active { transform: scale(.97); opacity: .85; }
.btn-primary { background: var(--accent); color: #000; }
.btn-gold    { background: var(--gold); color: #000; }
.btn-ghost   { background: var(--s2); color: var(--text); }
.btn-danger  { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-sm { padding: 8px 12px; font-size: 13px; margin-top: 0; }
.btn-inline { width: auto; display: inline-block; }

/* ── match card ────────────────────────────────────────────── */
.match-card {
  background: var(--s1);
  border-radius: var(--r-sm);
  border: 1px solid var(--border2);
  margin-bottom: 7px; overflow: hidden;
  transition: border-color .15s;
}
.match-card.clickable { cursor: pointer; }
.match-card.clickable:hover { border-color: var(--accent); }
.match-row {
  display: flex; align-items: center;
  padding: 12px 14px; gap: 8px;
}
.match-team-col {
  flex: 1; display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 15px;
  overflow: hidden;
}
.match-team-col.right { justify-content: flex-end; flex-direction: row-reverse; }
.t-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.t-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match-score-box {
  min-width: 64px; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.score-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 30px; line-height: 1;
}
.score-sep { color: var(--border); font-size: 20px; font-weight: 300; }
.match-vs { font-size: 13px; color: var(--text3); font-weight: 500; }
.phase-tag {
  padding: 4px 14px; font-size: 11px; font-weight: 700;
  letter-spacing: .6px; text-transform: uppercase;
}
.final-tag  { background: #f0a50018; color: var(--gold); }
.sf-tag     { background: #2f81f718; color: #4db8ff; }
.rest-row {
  padding: 0 14px 10px;
  font-size: 12px; color: var(--text3);
  display: flex; align-items: center; gap: 6px;
}

details[open] .det-arrow { transform: rotate(180deg); }
.det-arrow { transition: transform .2s; display:inline-block; }
.star-btn { background:none;border:none;cursor:pointer;font-size:17px;padding:0 1px;line-height:1;transition:color .1s; }
.draw-team-card { background:var(--s1);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px; }
.draw-team-name { font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px; }
.draw-player-chip { display:inline-flex;align-items:center;gap:4px;background:var(--s2);border-radius:20px;padding:3px 9px;font-size:12px;font-weight:600;margin:2px; }

/* ── standings ─────────────────────────────────────────────── */
.standings-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px; font-variant-numeric: tabular-nums;
}
.standings-table th {
  padding: 8px 6px; font-size: 10px; font-weight: 700;
  letter-spacing: .6px; text-transform: uppercase;
  color: var(--text3); text-align: center; border-bottom: 1px solid var(--border2);
}
.standings-table th:first-child { padding-left: 14px; }
.standings-table th:nth-child(2) { text-align: left; }
.standings-table td { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--border2); }
.standings-table td:first-child { padding-left: 14px; }
.standings-table td:nth-child(2) { text-align: left; }
.standings-table tr:last-child td { border-bottom: none; }
.td-pts { font-weight: 800; font-size: 14px; }
.td-pos { width: 32px; }
.pos-num { font-weight: 700; font-size: 13px; }
.sg-pos { color: #4DDA72; }
.sg-neg { color: var(--danger); }
.dot-sm { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; margin-right: 6px; }
.zone-note { font-size: 11px; color: var(--text3); }

/* ── champion banner ───────────────────────────────────────── */
.champion-banner {
  border-radius: var(--r); border: 1px solid;
  padding: 24px 16px 20px;
  text-align: center; margin-bottom: 10px;
  background: linear-gradient(135deg, #0d1117, #161b22);
}
.champ-icon { font-size: 44px; margin-bottom: 6px; }
.champ-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
.champ-name { font-family: 'Bebas Neue', sans-serif; font-size: 48px; line-height: 1; margin-top: 2px; }
.champ-players { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
.p-tag {
  padding: 4px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  background: #ffffff12; color: var(--text2);
}
.p-tag.half { color: #f0883e; background: #f0883e12; }

/* ── champ header bar ──────────────────────────────────────── */
.champ-bar {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 10px; gap: 10px;
}
.champ-date { font-weight: 700; font-size: 17px; }
.champ-fmt { font-size: 12px; color: var(--text3); margin-top: 2px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }

/* ── create form ───────────────────────────────────────────── */
.hint { font-size: 13px; color: var(--text2); padding: 12px 14px 8px; }
.team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 14px; }
.team-chk-label {
  display: flex; align-items: center; gap: 9px;
  padding: 12px; border-radius: var(--r-sm);
  border: 1.5px solid var(--border); cursor: pointer;
  background: var(--s1); transition: border-color .15s, background .15s;
  user-select: none;
}
.team-chk-label input { display: none; }
.chk-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
.chk-name { font-weight: 600; font-size: 14px; }
.fmt-hint {
  margin: 0 14px 12px;
  padding: 10px 12px; border-radius: var(--r-sm);
  background: var(--s2); font-size: 13px; color: var(--text2); line-height: 1.5;
}

/* ── ranking table ─────────────────────────────────────────── */
.rank-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.rank-table th {
  padding: 8px 10px; font-size: 10px; font-weight: 700; letter-spacing: .6px;
  text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border2);
  text-align: center;
}
.rank-table th:nth-child(2) { text-align: left; }
.rank-table td { padding: 11px 10px; border-bottom: 1px solid var(--border2); text-align: center; }
.rank-table td:nth-child(2) { text-align: left; }
.rank-table tr:last-child td { border-bottom: none; }
.td-titles { font-weight: 800; font-size: 16px; }
.td-date { font-size: 12px; color: var(--text2); }
.half-frac { font-size: 11px; opacity: .7; }

/* ── history ───────────────────────────────────────────────── */
.hist-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-bottom: 1px solid var(--border2);
  cursor: pointer; transition: background .1s;
}
.hist-row:hover { background: var(--s1); }
.hist-row:last-child { border-bottom: none; }
.hist-date { font-size: 12px; color: var(--text3); min-width: 60px; }
.hist-info { flex: 1; }
.hist-teams { font-size: 12px; color: var(--text3); }
.hist-champ { font-weight: 700; font-size: 14px; margin-top: 2px; }
.hist-arrow { color: var(--text3); font-size: 18px; }

/* ── modals ────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75); z-index: 200;
  display: flex; align-items: flex-end;
  padding: 0;
}
.sheet {
  background: var(--s0);
  border-radius: 18px 18px 0 0;
  border-top: 1px solid var(--border);
  width: 100%; max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  max-height: 90dvh; overflow-y: auto;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 0 auto 16px;
}

/* score modal */
.score-vs-row {
  display: flex; align-items: center;
  justify-content: center; gap: 20px;
  padding: 16px 0 8px;
}
.score-team-col { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; }
.score-team-nm { font-weight: 700; font-size: 16px; text-align: center; }
.score-stepper { display: flex; align-items: center; gap: 12px; }
.step-btn {
  width: 48px; height: 48px; border-radius: 12px;
  background: var(--s2); border: 1px solid var(--border);
  color: var(--text); font-size: 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s;
}
.step-btn:active { background: var(--border); }
.step-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 52px; line-height: 1; min-width: 48px; text-align: center;
}
.score-x { font-size: 20px; color: var(--text3); align-self: flex-end; padding-bottom: 14px; }

/* champion modal */
.champ-modal-hdr { text-align: center; padding: 8px 0 16px; }
.champ-modal-name { font-family: 'Bebas Neue', sans-serif; font-size: 42px; line-height: 1; margin-top: 4px; }
.champ-modal-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
.player-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border2);
}
.player-input {
  flex: 1; background: var(--s2); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 10px 12px;
  color: var(--text); font-family: inherit; font-size: 14px;
  outline: none; transition: border-color .15s;
}
.player-input:focus { border-color: var(--accent); }
.weight-btns { display: flex; gap: 4px; }
.wbtn {
  padding: 8px 11px; border-radius: 8px;
  border: 1px solid var(--border); background: none;
  color: var(--text2); font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background .1s, color .1s;
}
.wbtn.on { background: var(--accent); border-color: var(--accent); color: #000; }
.add-player-btn { background: none; color: var(--text2); border: 1px dashed var(--border); margin-top: 10px; }

/* ── empty / loading ───────────────────────────────────────── */
.empty { text-align: center; padding: 60px 24px; }
.empty .ei { font-size: 52px; margin-bottom: 14px; }
.empty h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.empty p { font-size: 14px; color: var(--text2); line-height: 1.5; margin-bottom: 24px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px; color: var(--text2); }
.spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
  .sheet { animation: none; }
}

/* ── toast ─────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 14px);
  left: 50%; transform: translateX(-50%);
  background: var(--s1); border: 1px solid var(--border);
  color: var(--text); padding: 10px 16px; border-radius: 10px;
  font-size: 14px; font-weight: 500; z-index: 500;
  max-width: 88%; text-align: center; pointer-events: none;
  animation: fadeUp .2s ease;
}
.toast.err { border-color: var(--danger); color: #ff8080; }
.toast.ok  { border-color: var(--accent); color: var(--accent); }
@keyframes fadeUp {
  from { opacity:0; transform:translateX(-50%) translateY(8px); }
  to   { opacity:1; transform:translateX(-50%) translateY(0); }
}

/* ── round label ────────────────────────────────────────────── */
.round-lbl {
  font-size: 10px; font-weight: 700; letter-spacing: .7px;
  text-transform: uppercase; color: var(--text3);
  padding: 8px 0 4px; opacity: .8;
}

/* ── active-champ warning in create ────────────────────────── */
.warn-box {
  margin: 8px 14px 0; padding: 10px 12px;
  border-radius: var(--r-sm); border-left: 3px solid var(--danger);
  background: #f8514910; font-size: 13px; color: #ff8080; line-height: 1.4;
}
</style>

<script>
const CLOUDINARY_CLOUD = 'fwtyio7l';
const CLOUDINARY_PRESET = 'aceoma_uploads';
async function cloudinaryUpload(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`, {method:'POST', body:fd});
  if (!res.ok) throw new Error('Upload falhou: ' + res.status);
  const data = await res.json();
  return data.secure_url;
}
</script>

<script>
'use strict';

/* ── Firebase config ────────────────────────────────────────── */
const firebaseConfig = {
  apiKey: "AIzaSyAp8LdT0n6Sg3cipCeZZPVZdCwoa7eOogg",
  authDomain: "seriebaceoma.firebaseapp.com",
  projectId: "seriebaceoma",
  storageBucket: "seriebaceoma.firebasestorage.app",
  messagingSenderId: "354275671624",
  appId: "1:354275671624:web:e2318f3726e6c9487b627d"
};

/* ── teams ──────────────────────────────────────────────────── */
const T = {
  azul:     { l: 'Azul',     c: '#4DB8FF' },
  preto:    { l: 'Preto',    c: '#9EA7B3' },
  amarelo:  { l: 'Amarelo',  c: '#F5C842' },
  vermelho: { l: 'Vermelho', c: '#FF5C5C' },
  laranja:  { l: 'Laranja',  c: '#FF8A3C' },
  verde:    { l: 'Verde',    c: '#4DDA72' },
};
const FMT = { 3:'Vira (3 times)', 4:'Todos contra todos', 5:'Fase de grupos + Semis' };

/* ── state ──────────────────────────────────────────────────── */
const st = {
  view: 'home',
  champs: [],
  ranks: [],
  players: [],
  modal: null,
  histId: null,
  confirmDelete: null,
  rankFilter: {type:'all', val:null},
  statsFilter: {minTitles: 0, player: ''},
  showInactive: false,
  ready: false,
  drawNumTeams: 3,
  drawMode: 'balanced',
  drawExtras: [],
  drawAbsent: [],
  drawResult: null,
  drawTeamColors: [],
  drawOpen: false,
  createPresetTeams: [],
  createRosters: {},
  playerTeamMap: {},
  finCfg: {valorMensalidade: 50, valorChurrasco: 0, saldoInicial: 0, reserva: 300, valorAvulso: 20},
  finMens: {},
  finDesp: [],
  finAvulsos: [],
  finMonth: new Date().toISOString().slice(0,7),
  finPrevisaoOculta: true,
  authUser: null,
  userRole: null,
  userDoc: null,
  createAuthorized: false,
  _loginTab: 'email',
};

/* ── helpers ────────────────────────────────────────────────── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const fdt = d => { if(!d)return''; const[y,m,dy]=d.split('-'); return `${dy}/${m}/${y}`; };
const tc = t => T[t]?.c || '#8B949E';
const tl = t => T[t]?.l || t;
const activeChamp = () => st.champs.find(c => c.status === 'active');

/* ── championship logic (pure) ──────────────────────────────── */
function genRoundRobinRounds(teams) {
  const n = teams.length;
  const rounds = [];
  if (n % 2 === 0) {
    const fixed = teams[0];
    let rot = teams.slice(1);
    for (let r = 0; r < n - 1; r++) {
      const pairs = [[fixed, rot[0]]];
      for (let i = 1; i < n / 2; i++) pairs.push([rot[i], rot[n - 1 - i]]);
      rounds.push(pairs);
      rot = [...rot.slice(1), rot[0]];
    }
  } else {
    let rot = [...teams];
    for (let r = 0; r < n; r++) {
      const pairs = [];
      for (let i = 1; i <= (n - 1) / 2; i++) pairs.push([rot[i], rot[n - i]]);
      rounds.push(pairs);
      rot = [...rot.slice(1), rot[0]];
    }
  }
  return rounds;
}

function genMatches(teams, fmt) {
  const ms = [];
  if (fmt === 3) {
    ms.push({ id:`m_${uid()}`, home:teams[0], away:teams[1], rest:teams[2], hs:null, as:null, phase:'regular', seq:1, played:false });
  } else {
    const rounds = genRoundRobinRounds(teams);
    const legs = fmt === 4 ? 2 : 1;
    let n = 0;
    for (let lg = 0; lg < legs; lg++) {
      for (let r = 0; r < rounds.length; r++) {
        for (const [h, a] of rounds[r]) {
          ms.push({
            id: `m_${++n}`,
            home: lg === 0 ? h : a,
            away: lg === 0 ? a : h,
            hs: null, as: null,
            phase: 'regular',
            leg: fmt === 4 ? lg + 1 : null,
            round: r + 1,
            played: false,
          });
        }
      }
    }
  }
  return ms;
}

function standings(teams, matches) {
  const s = Object.fromEntries(teams.map(t=>[t,{team:t,j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0}]));
  for (const m of matches) {
    if (!m.played || m.phase!=='regular' || m.hs==null) continue;
    const h=s[m.home], a=s[m.away];
    if (!h||!a) continue;
    h.j++; a.j++; h.gp+=m.hs; h.gc+=m.as; a.gp+=m.as; a.gc+=m.hs;
    if (m.hs>m.as)       { h.v++; h.pts+=3; a.d++; }
    else if (m.as>m.hs)  { a.v++; a.pts+=3; h.d++; }
    else                 { h.e++; h.pts++;  a.e++; a.pts++; }
  }
  return Object.values(s).sort((a,b)=>{
    if (b.pts!==a.pts) return b.pts-a.pts;
    const sa=a.gp-a.gc, sb=b.gp-b.gc;
    return sb!==sa ? sb-sa : b.gp-a.gp;
  });
}

function next3(matches) {
  const done = matches.filter(m=>m.phase==='regular'&&m.played).sort((a,b)=>b.seq-a.seq);
  if (!done.length) return null;
  const last=done[0];
  const winner=last.hs>last.as?last.home:last.away;
  const loser =last.hs>last.as?last.away:last.home;
  return { id:`m_${uid()}`, home:winner, away:last.rest, rest:loser, hs:null,as:null, phase:'regular', seq:last.seq+1, played:false };
}

function champion(matches) {
  const f=matches.find(m=>m.phase==='final'&&m.played);
  if (!f||f.hs===f.as) return null;
  return f.hs>f.as?f.home:f.away;
}

function initFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    DB = firebase.firestore();
    AUTH = firebase.auth();

    if (AUTH.isSignInWithEmailLink(location.href)) {
      const storedEmail = localStorage.getItem('aceoma_emailForSignIn');
      if (storedEmail) {
        AUTH.signInWithEmailLink(storedEmail, location.href)
          .then(() => {
            localStorage.removeItem('aceoma_emailForSignIn');
            history.replaceState(null, '', location.pathname);
          })
          .catch(e => toast('Erro no link de acesso: ' + e.message));
      }
    }

    AUTH.onAuthStateChanged(async user => {
      st.authUser = user;
      if (!user) {
        _unsubListeners.forEach(u=>u()); _unsubListeners = [];
        st.champs=[]; st.ranks=[]; st.players=[]; st.finMens={}; st.finDesp=[]; st.finAvulsos=[];
        st.userRole = null; st.userDoc = null; st.ready = true;
        render(); return;
      }
      try {
        const snap = await DB.doc(`users/${user.uid}`).get();
        if (snap.exists) {
          st.userDoc = snap.data();
          st.userRole = snap.data().role || 'pending';
        } else {
          let role = 'pending';
          if (user.email === 'castanho.caiop@gmail.com') {
            role = 'admin';
          } else {
            const inviteToken = new URLSearchParams(location.search).get('invite');
            if (inviteToken) {
              try {
                const tokenSnap = await DB.doc(`invite_tokens/${inviteToken}`).get();
                if (tokenSnap.exists && !tokenSnap.data().used) {
                  role = tokenSnap.data().role || 'player';
                  await DB.doc(`invite_tokens/${inviteToken}`).update({used:true, usedBy:user.uid, usedAt:new Date().toISOString()});
                  history.replaceState(null, '', location.pathname);
                }
              } catch(e) {}
            }
          }
          const newDoc = {email:user.email||'', displayName:user.displayName||'', role, createdAt:new Date().toISOString()};
          await DB.doc(`users/${user.uid}`).set(newDoc);
          st.userDoc = newDoc; st.userRole = role;
        }
      } catch(e) {
        st.userRole = user.email === 'castanho.caiop@gmail.com' ? 'admin' : 'pending';
      }
      if (st.userRole !== 'pending') startListeners();
      else { st.ready = true; render(); }
    });
  } catch(e) {
    st.ready = true; render();
    toast('Erro ao conectar: ' + (e?.message || e));
  }
}

async function submitScore(matchId, hs, as_, goals=[]) {
  if (!DB) return;
  const champ = activeChamp();
  if (!champ) return;
  try {
    const ref = DB.doc(`championships/${champ.id}`);
    const fmt = champ.format;
    const wasPlayed = champ.matches.find(m=>m.id===matchId)?.played || false;
    const matches = champ.matches.map(m => m.id===matchId ? {...m,hs,as:as_,played:true,goals} : {...m});
    const mi = matches.findIndex(m=>m.id===matchId);

    if (!wasPlayed) {
      if (fmt===3 && matches[mi].phase==='regular' && !champ.regularEnded) {
        const nxt = next3(matches);
        if (nxt) matches.push(nxt);
      }

      if (fmt===4) {
        const regDone = matches.filter(m=>m.phase==='regular').every(m=>m.played);
        if (regDone && !matches.some(m=>m.phase==='final')) {
          const st2 = standings(champ.teams, matches);
          matches.push({id:'final',home:st2[0].team,away:st2[1].team,hs:null,as:null,phase:'final',played:false});
        }
      }

      if (fmt===5) {
        const regDone = matches.filter(m=>m.phase==='regular').every(m=>m.played);
        if (regDone && !matches.some(m=>m.phase==='semifinal')) {
          const st2 = standings(champ.teams, matches);
          matches.push(
            {id:'sf1',home:st2[0].team,away:st2[3].team,hs:null,as:null,phase:'semifinal',played:false},
            {id:'sf2',home:st2[1].team,away:st2[2].team,hs:null,as:null,phase:'semifinal',played:false}
          );
        }
        const sfs = matches.filter(m=>m.phase==='semifinal');
        if (sfs.length===2 && sfs.every(m=>m.played) && !matches.some(m=>m.phase==='final')) {
          const w1=sfs[0].hs>sfs[0].as?sfs[0].home:sfs[0].away;
          const w2=sfs[1].hs>sfs[1].as?sfs[1].home:sfs[1].away;
          matches.push({id:'final',home:w1,away:w2,hs:null,as:null,phase:'final',played:false});
        }
      }
    }

    await ref.update({matches});
    st.modal = null;

    if (!wasPlayed && matches[mi].phase==='final') {
      const champ2 = hs>as_?matches[mi].home:matches[mi].away;
      st.modal = {type:'champion', champion:champ2, players:defPlayers()};
    }
    render();
  } catch(e) { toast('Erro ao salvar placar: ' + (e?.message||e)); }
}

async function endRegular() {
  if (!DB) { toast('Banco de dados não conectado.'); return; }
  const champ = activeChamp();
  if (!champ) return;
  try {
    const ref = DB.doc(`championships/${champ.id}`);
    const matches = champ.matches.filter(m=>!(m.phase==='regular'&&!m.played));
    const st2 = standings(champ.teams, matches);
    matches.push({id:'final',home:st2[0].team,away:st2[1].team,hs:null,as:null,phase:'final',played:false});
    await ref.update({matches, regularEnded:true});
  } catch(e) { toast('Erro ao encerrar fase: ' + (e?.message||e)); }
}

async function saveChampion() {
  if (!DB||!st.modal?.players) return;

  document.querySelectorAll('#plist .player-input').forEach((inp,i) => {
    if (st.modal.players[i]) st.modal.players[i].name = inp.value;
  });

  const snap = JSON.parse(JSON.stringify(st.modal));

  let champId, champDate;
  if (snap.champId) {
    champId = snap.champId;
    champDate = snap.champDate || today();
  } else {
    const champ = activeChamp();
    if (!champ) return;
    champId = champ.id;
    champDate = champ.date;
  }

  const players = snap.players.filter(p=>p.name.trim());
  if (!players.length) { toast('Adicione ao menos um jogador.'); return; }

  st.modal = {type:'saving'};
  render();

  try {
    const champTeam = snap.champion;
    await DB.doc(`championships/${champId}`).update({status:'completed', champion:champTeam, champion_players:players});

    for (const p of players) {
      const key = playerKey(p.name.trim());
      if (!key) continue;
      const pref = DB.doc(`player_titles/${key}`);
      const ex = await pref.get();
      const entry = {date:champDate, weight:p.weight, team:champTeam, champId};
      if (ex.exists) {
        const d = ex.data();
        const allEntries = [...(d.entries||[]), entry];
        const last_date = allEntries.reduce((ld,e)=>e.date>ld?e.date:ld, '');
        await pref.update({name:p.name.trim(), titles:(d.titles||0)+p.weight, last_date, entries:allEntries});
      } else {
        await pref.set({name:p.name.trim(), titles:p.weight, last_date:champDate, entries:[entry]});
      }
    }
    st.modal = null;
    render();
  } catch(e) {
    st.modal = snap;
    render();
    toast('Erro ao salvar campeão: ' + (e?.message||e));
  }
}

async function swapMatchesInChamp(champId, mId1, mId2) {
  const champ = st.champs.find(c=>c.id===champId);
  if (!champ) return;
  const matches = [...champ.matches];
  const i1=matches.findIndex(m=>m.id===mId1), i2=matches.findIndex(m=>m.id===mId2);
  if (i1<0||i2<0) return;
  [matches[i1],matches[i2]]=[matches[i2],matches[i1]];
  try { await DB.doc(`championships/${champId}`).update({matches}); }
  catch(e) { toast('Erro: '+(e?.message||e)); }
}

async function swapRoundsInChamp(champId, r1, r2) {
  const champ = st.champs.find(c=>c.id===champId);
  if (!champ) return;
  const matches = champ.matches.map(m => {
    if (m.round===r1) return {...m,round:r2};
    if (m.round===r2) return {...m,round:r1};
    return m;
  });
  try { await DB.doc(`championships/${champId}`).update({matches}); }
  catch(e) { toast('Erro: '+(e?.message||e)); }
}

async function deleteChampionship(id) {
  if (!DB) { toast('Banco de dados não conectado.'); return; }
  const champ = st.champs.find(c => c.id === id);
  if (!champ) return;
  try {
    if (champ.status === 'completed' && champ.champion_players?.length) {
      for (const p of champ.champion_players) {
        const key = playerKey(p.name.trim());
        if (!key) continue;
        const pref = DB.doc(`player_titles/${key}`);
        const ex = await pref.get();
        if (!ex.exists) continue;
        const d = ex.data();
        const entries = (d.entries||[]).filter(e =>
          e.champId ? e.champId !== id
                    : !(e.date===champ.date && e.team===champ.champion && e.weight===p.weight)
        );
        if (!entries.length) {
          await pref.delete();
        } else {
          const titles = entries.reduce((s,e)=>s+e.weight, 0);
          const last_date = entries.reduce((ld,e)=>e.date>ld?e.date:ld, '');
          await pref.update({titles, last_date, entries});
        }
      }
    }
    await DB.doc(`championships/${id}`).delete();
    st.histId = null;
    st.confirmDelete = null;
    toast('Campeonato excluído.', 'ok');
  } catch(e) {
    toast('Erro ao excluir: ' + (e?.message||e));
  }
}

async function renamePlayer() {

  if (!newKey) { toast('Nome inválido.'); return; }
  try {
    const old = st.players.find(p=>p.id===oldKey) || {};

    // 1. player_registry
    if (newKey !== oldKey) {
      const regData = {name: newName, added: old.added||today(), active: old.active!==false};
      if (old.stars != null) regData.stars = old.stars;
      await DB.doc(`player_registry/${newKey}`).set(regData);
      await DB.doc(`player_registry/${oldKey}`).delete();
    } else {
      await DB.doc(`player_registry/${oldKey}`).update({name: newName});
    }

    // 2. player_titles (keyed by sanitized name — migrate key + update name field)
    if (newKey !== oldKey) {
      const titlesDoc = await DB.doc(`player_titles/${oldKey}`).get();
      if (titlesDoc.exists) {
        await DB.doc(`player_titles/${newKey}`).set({...titlesDoc.data(), name: newName});
        await DB.doc(`player_titles/${oldKey}`).delete();
      }
    } else {
      // Same sanitized key — just update the display name in player_titles
      const titlesDoc = await DB.doc(`player_titles/${oldKey}`).get();
      if (titlesDoc.exists) await DB.doc(`player_titles/${oldKey}`).update({name: newName});
    }

    // 3. financeiro_mensalidades (payments keyed by display name)
    const updates = [];
    for (const [month, data] of Object.entries(st.finMens||{})) {
      const pags = data?.pagamentos || {};
      if (Object.prototype.hasOwnProperty.call(pags, oldName)) {
        const newPags = {...pags, [newName]: pags[oldName]};
        delete newPags[oldName];
        updates.push(DB.doc(`financeiro_mensalidades/${month}`).update({pagamentos: newPags}));
      }
    }

    // 4. championships — champion_players (keyed by display name)
    for (const champ of (st.champs||[])) {
      if (!champ.champion_players?.some(p=>p.name===oldName)) continue;
      const newPlayers = champ.champion_players.map(p=>p.name===oldName?{...p,name:newName}:p);
      updates.push(DB.doc(`championships/${champ.id}`).update({champion_players: newPlayers}));
    }

    await Promise.all(updates);

    st.modal = null;
    render();
    toast('Nome atualizado!', 'ok');
  } catch(e) { toast('Erro: '+(e?.message||e)); }
}

function balancedDraw(players, n) {
  /* shuffle within same-star tiers for randomness, then snake draft + swap */
  const byStars = {};
  for (const p of players) {
    const s = p.stars || 3;
    if (!byStars[s]) byStars[s] = [];
    byStars[s].push(p);
  }
  for (const arr of Object.values(byStars)) {
    for (let i = arr.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
  }
  const sorted = [5,4,3,2,1].flatMap(s => byStars[s]||[]);

  const teams = Array.from({length:n}, ()=>[]);
  const sums = new Array(n).fill(0);
  let dir = 1, idx = 0;
  for (const p of sorted) {
    teams[idx].push(p);
    sums[idx] += p.stars || 3;
    idx += dir;
    if (idx >= n) { idx = n-1; dir = -1; }
    else if (idx < 0) { idx = 0; dir = 1; }
  }

  /* swap optimization: minimize range(sums) */
  let improved = true;
  while (improved) {
    improved = false;
    for (let i = 0; i < n && !improved; i++) {
      for (let j = i+1; j < n && !improved; j++) {
        for (let pi = 0; pi < teams[i].length && !improved; pi++) {
          for (let pj = 0; pj < teams[j].length && !improved; pj++) {
            const si = teams[i][pi].stars||3, sj = teams[j][pj].stars||3;
            if (si === sj) continue;
            const ns = [...sums]; ns[i]=ns[i]-si+sj; ns[j]=ns[j]-sj+si;
            if (Math.max(...ns)-Math.min(...ns) < Math.max(...sums)-Math.min(...sums)) {
              [teams[i][pi],teams[j][pj]] = [teams[j][pj],teams[i][pi]];
              sums[i]=ns[i]; sums[j]=ns[j];
              improved = true;
            }
          }
        }
      }
    }
  }
  return {teams, sums};
}

function randomDraw(players, n) {
  const shuffled = [...players];
  for (let i = shuffled.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  const teams = Array.from({length:n}, ()=>[]);
  const sums  = new Array(n).fill(0);
  shuffled.forEach((p,i) => { const t=i%n; teams[t].push(p); sums[t]+=(p.stars||3); });
  return {teams, sums};
}

function runBalancedDraw() {
  const absentSet = new Set(st.drawAbsent);
  const present = st.players.filter(p=>p.active!==false && !absentSet.has(p.id));
  const extras = (st.drawExtras||[]).filter(n=>n.trim()).map(n=>({name:n.trim(),stars:0,id:'_extra_'+n}));
  const allPresent = [...present, ...extras];
  if (allPresent.length < st.drawNumTeams) { toast('Jogadores insuficientes'); return; }
  st.drawResult = st.drawMode === 'random'
    ? randomDraw(allPresent, st.drawNumTeams)
    : balancedDraw(allPresent, st.drawNumTeams);
  st.drawTeamColors = new Array(st.drawNumTeams).fill('');
  render();
}

    const zone = fmt===5&&i<4?'sf-zone':((fmt===3||fmt===4)&&i<2)?'f-zone':'';

      <td class="td-pos"><span class="pos-num" style="color:${posC[i]||'#6e7681'}">${i+1}°</span></td>
      <td><span class="dot-sm" style="background:${tc2.c}"></span><span style="color:${tc2.c};font-weight:600">${tc2.l}</span></td>
      <td>${s.j}</td><td>${s.v}</td><td>${s.e}</td><td>${s.d}</td>
      <td class="${sg>=0?'sg-pos':'sg-neg'}">${sg>0?'+':''}${sg}</td>
      <td class="td-pts">${s.pts}</td>
    </tr>`;
  }).join('');
  const note = fmt===5
    ? '<span class="zone-note">Top 4 → Semis</span>'
    : '<span class="zone-note">Top 2 → Final</span>';
  return `<div class="card">
    <div class="card-hdr"><span class="card-lbl">Classificação</span>${note}</div>

      <thead><tr><th></th><th>Time</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderChamp(champ, editable=false) {
  const {teams,format:fmt,matches,date,status,champion_players,regularEnded}=champ;
  const chmpTeam = champion(matches);
  const regMs = matches.filter(m=>m.phase==='regular');
  const sfMs  = matches.filter(m=>m.phase==='semifinal');
  const finM  = matches.find(m=>m.phase==='final');
  const playedReg = regMs.filter(m=>m.played);
  let html='';

  if (chmpTeam) {
    const ct=T[chmpTeam]||{l:chmpTeam,c:'#F0A500'};
    const artList=champArtilheiros(champ);
    const artHtml=artList.length
      ?`<div style="margin-top:8px;font-size:12px;color:var(--text2)">⚽ <span style="color:var(--text3)">Artilheiro:</span> ${artList.map(a=>`<strong>${esc(a.name)}</strong> (${a.goals})`).join(', ')}</div>`:'';
    html+=`<div class="champion-banner" style="border-color:${ct.c}35;box-shadow:0 0 40px ${ct.c}18">
      <div class="champ-icon">🏆</div>
      <div class="champ-eyebrow">Campeão</div>
      <div class="champ-name" style="color:${ct.c}">${ct.l}</div>
      ${champion_players?.length?`<div class="champ-players">
        ${champion_players.map(p=>`<span class="p-tag${p.weight<1?' half':''}">${p.name}${p.weight<1?' ½':''}</span>`).join('')}
      </div>`:''}
      ${artHtml}
    </div>`;
  }

  html+=`<div class="champ-bar">
    <div><div class="champ-date">${fdt(date)}</div><div class="champ-fmt">${FMT[fmt]||''}</div></div>
    <div class="chips-row">${teams.map(t=>chip(t,true)).join('')}</div>
  </div>`;

  html += standingsTable(teams, matches, fmt);

  {
    const analysis = analyzeClassification(champ);
    if (analysis) {
      const phaseLabel = analysis.qualify === 2 ? 'Final' : 'Semifinais';
      const roundLabel = analysis.roundsLeft === 1 ? 'Última rodada' : `${analysis.roundsLeft} rodadas restantes`;
      html += `<details class="card" style="padding:0" open>
        <summary style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;list-style:none;user-select:none">
          <span>
            <span style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3)">🔍 Cenários — ${phaseLabel}</span>
            <span style="font-size:11px;color:var(--text3);margin-left:8px;font-weight:400">${roundLabel}</span>
          </span>
          <span class="det-arrow" style="font-size:11px;color:var(--text3)">▼</span>
        </summary>
        ${analysis.teams.map(t => {
          const tc = T[t.team]||{l:t.team,c:'#8B949E'};
          return `<div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border2)">
            <span style="font-size:15px;width:20px;text-align:center">${t.icon}</span>
            <span style="flex:1;font-size:13px;font-weight:700;color:${tc.c}">${tc.l}</span>
            <span style="font-size:12px;color:var(--text2);text-align:right;max-width:180px">${esc(t.detail)}</span>
          </div>`;
        }).join('')}
      </details>`;
    }
  }

  {
    const tally = champGoalTally(champ);
    const artRows = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    if (artRows.length) {
      const maxG = artRows[0][1];
      html += `<details class="card" style="padding:0">
        <summary style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;list-style:none;user-select:none">
          <span style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3)">⚽ Artilheiros</span>
          <span style="font-size:11px;color:var(--text3)" class="det-arrow">▼</span>
        </summary>
        ${artRows.map(([name,g],i)=>`
          <div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border2)">
            <span style="font-size:11px;font-weight:700;color:${g===maxG?'var(--gold)':'#6e7681'};width:18px">${i+1}°</span>
            <span style="flex:1;font-size:13px;font-weight:600">${esc(name)}</span>
            ${g===maxG?`<span style="font-size:10px;color:var(--gold)">⭐</span>`:''}
            <span style="font-weight:800;font-size:15px;color:#4DB8FF">${g}</span>
          </div>`).join('')}
      </details>`;
    }
  }

  const swapMatchBtn = (id1,id2) => editable
    ? `<div style="text-align:center;margin:-3px 0;position:relative;z-index:1">
        <button onclick="swapMatchesInChamp('${champ.id}','${id1}','${id2}')"
          style="background:var(--s1);border:1px solid var(--border);border-radius:6px;cursor:pointer;
                 font-size:11px;padding:2px 12px;color:var(--text3)">⇅ trocar ordem</button></div>` : '';

  const roundHeader = (r, unplayedRounds, showSwap) => {
    if (!showSwap) return `<div class="round-lbl">Rodada ${r}</div>`;
    const idx=unplayedRounds.indexOf(r);
    const prev=idx>0?unplayedRounds[idx-1]:null, next=idx<unplayedRounds.length-1?unplayedRounds[idx+1]:null;
    const btn=(dir,t)=>t!==null?`<button onclick="swapRoundsInChamp('${champ.id}',${r},${t})"
      style="background:var(--s1);border:1px solid var(--border);border-radius:4px;cursor:pointer;
             font-size:11px;padding:1px 6px;color:var(--text2)">${dir}</button>`:'<span style="width:22px"></span>';
    return `<div class="round-lbl" style="display:flex;align-items:center;justify-content:space-between">
      <span>Rodada ${r}</span><div style="display:flex;gap:3px">${btn('▲',prev)}${btn('▼',next)}</div></div>`;
  };

  const renderRounds = (ms, showSwap=false) => {
    const all=[...new Set(ms.map(m=>m.round).filter(Boolean))].sort((a,b)=>a-b);
    const unplayed=all.filter(r=>ms.filter(m=>m.round===r).some(m=>!m.played));
    const done=all.filter(r=>ms.filter(m=>m.round===r).every(m=>m.played));
    let h='';
    for (const r of unplayed) {
      h+=roundHeader(r,unplayed,showSwap);
      const rMs=ms.filter(m=>m.round===r), up=rMs.filter(m=>!m.played);
      h+=up.map(m=>matchCard(m,editable)).join('');
      h+=[...rMs.filter(m=>m.played)].reverse().map(m=>matchCard(m,editable)).join('');
    }
    for (const r of done) {
      h+=`<div class="round-lbl">Rodada ${r}</div>`;
      h+=ms.filter(m=>m.round===r).map(m=>matchCard(m,editable)).join('');
    }
    return h;
  };

  if (fmt===3 && !regularEnded && !chmpTeam) {
    const unplayed=regMs.filter(m=>!m.played);
    if (unplayed.length) {
      html+=`<div class="sec-lbl">Próxima${unplayed.length>1?'s Partidas':' Partida'}</div>`;
      unplayed.forEach((m,i)=>{ html+=matchCard(m,editable); if(i<unplayed.length-1) html+=swapMatchBtn(m.id,unplayed[i+1].id); });
    }
    if (editable && playedReg.length>=3)
      html+=`<button class="btn btn-danger" onclick="confirmEnd()">⏹ Encerrar Fase Regular</button>`;
    if (playedReg.length)
      html+=`<div class="sec-lbl">Partidas Disputadas</div>`+
        [...playedReg].reverse().map(m=>matchCard(m,editable)).join('');
  }

  if (fmt===4) {
    const leg1Ms=regMs.filter(m=>m.leg===1), leg2Ms=regMs.filter(m=>m.leg===2);
    const leg1Done=leg1Ms.length&&leg1Ms.every(m=>m.played);
    const legs=leg1Done?[2,1]:[1,2];
    for (const lg of legs) {
      const legMs=regMs.filter(m=>m.leg===lg);
      const isActiveLeg=legMs.some(m=>!m.played);
      const showSwap=editable&&isActiveLeg;
      if (lg===2&&leg1Done) {
        html+=`<div class="sec-lbl" style="display:flex;align-items:center;gap:8px">
          <span>Returno</span>
          <span style="background:var(--accent);color:#000;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px">EM ANDAMENTO</span>
        </div>`;
      } else {
        const note=lg===2&&!leg1Done?` <span style="font-size:11px;color:var(--text3);font-weight:400">· ordem segue turno 1</span>`:'';
        html+=`<div class="sec-lbl">Turno ${lg}${note}</div>`;
      }
      const roundNums=[...new Set(legMs.map(m=>m.round).filter(Boolean))].sort((a,b)=>a-b);
      html+=roundNums.length?renderRounds(legMs,showSwap):legMs.map(m=>matchCard(m,editable)).join('');
    }
  }
  if (fmt===5) {
    html+=`<div class="sec-lbl">Fase de Grupos</div>`;
    const roundNums=[...new Set(regMs.map(m=>m.round).filter(Boolean))].sort((a,b)=>a-b);
    html+=roundNums.length ? renderRounds(regMs, editable) : regMs.map(m=>matchCard(m,editable)).join('');
  }
  if (sfMs.length) {
    html+=`<div class="sec-lbl">Semifinais</div>`;
    html+=sfMs.map(m=>matchCard(m,editable)).join('');
  }
  if (finM) {
    html+=`<div class="sec-lbl">Final</div>`+matchCard(finM, editable);
    if (!editable && finM.played) {
      const hasFG = finM.finalGoals?.length > 0 || finM.goals?.length > 0;
      html+=`<button onclick="openFinalGoalsEdit('${champ.id}','${finM.id}')"
        style="display:flex;align-items:center;gap:6px;margin:6px 0 0;background:none;border:1px solid var(--border);
               border-radius:8px;padding:7px 14px;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;width:100%">
        <span>⚽</span>
        <span style="flex:1;text-align:left">${hasFG ? 'Editar gols da final' : 'Indicar gols da final'}</span>
        ${hasFG?`<span style="color:var(--text3);font-weight:400">${(finM.finalGoals?.length||finM.goals?.length||0)} gol${(finM.finalGoals?.length||finM.goals?.length||0)!==1?'s':''} registrados</span>`:''}
      </button>`;
    }
  }
  if (editable && finM?.played && status==='active')
    html+=`<button class="btn btn-gold" onclick="openChampModal()">🏆 Registrar Jogadores Campeões</button>`;

  return html;
}

function renderPlayerAssignInner(selectedTeams) {
  if (!selectedTeams || selectedTeams.length < 2) return '';
  const active = st.players.filter(p => p.active !== false);
  if (!active.length) return '';
  const map = st.playerTeamMap;
  const rows = active.map(p => {
    const assigned = map[p.name] || null;
    const btns = selectedTeams.map(tid => {
      const t = T[tid];
      const sel = assigned === tid;
      return `<button onclick="setManualRoster('${p.name.replace(/'/g,"\\'")}','${tid}')" title="${t.l}"
        style="width:22px;height:22px;border-radius:50%;border:2.5px solid ${sel?'var(--text)':'transparent'};
               background:${sel?t.c:t.c+'40'};cursor:pointer;padding:0;flex-shrink:0;transition:all .1s"></button>`;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--border2)">
      <span style="flex:1;font-size:13px;font-weight:600;${assigned?'':'color:var(--text3)'}">${esc(p.name)}</span>
      <div style="display:flex;gap:5px">${btns}</div>
    </div>`;
  }).join('');
  const assigned = active.filter(p => map[p.name]).length;
  return `<div style="padding:2px 14px 6px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:12px;color:var(--text3)">${assigned} de ${active.length} distribuídos</span>
    ${assigned ? `<button onclick="st.playerTeamMap={};refreshPlayerAssign()" style="background:none;border:none;font-size:12px;color:var(--text3);cursor:pointer;padding:2px 4px">Limpar</button>` : ''}
  </div>${rows}`;
}

function refreshPlayerAssign() {
  const el = document.getElementById('player-assign-inner');
  const ck = [...document.querySelectorAll('.tck:checked')].map(c => c.value);
  if (el) el.innerHTML = renderPlayerAssignInner(ck);
}

function setManualRoster(playerName, teamId) {
  if (st.playerTeamMap[playerName] === teamId) delete st.playerTeamMap[playerName];
  else st.playerTeamMap[playerName] = teamId;
  st.createRosters = {}; // clear draw rosters when manual assignment is used
  refreshPlayerAssign();
}

function applyDrawToForm() {
  const colors = (st.drawTeamColors || []).filter(Boolean);
  if (colors.length < st.drawNumTeams) { toast('Atribua uma cor para cada time primeiro'); return; }
  const rosters = {};
  (st.drawResult?.teams || []).forEach((tp, i) => {
    const colorId = st.drawTeamColors[i];
    if (colorId) rosters[colorId] = tp.map(p => p.name);
  });
  st.createPresetTeams = colors;
  st.createRosters = rosters;
  render();
  requestAnimationFrame(() => {
    onTkChg();
    document.getElementById('champ-date')?.scrollIntoView({behavior:'smooth', block:'center'});
  });
}

    const {tally} = computeGoalsRanking();

    resultHtml = `<div style="padding:12px 14px 4px">

                   background:${t.c};cursor:pointer;opacity:${taken?.3:1};padding:0;flex-shrink:0"></button>`;

        ${(st.drawExtras||[]).map((name,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:3px 0">

        </div>
      </div>
      <div style="padding:12px 14px">
        <button id="draw-run-btn" class="btn btn-primary" onclick="runBalancedDraw()" ${canDraw?'':'disabled'}

    </details>
  </div>`;

function vRanking() {
  if (!st.ready) return `<div class="loading"><div class="spinner"></div></div>`;
  if (!st.ranks.length) return `<div class="empty">
    <div class="ei">🏆</div>
    <h3>Ranking vazio</h3>
    <p>Conclua campeonatos para ver o ranking!</p>
  </div>`;

  const filter = st.rankFilter||{type:'all'};
  const _rankRaw = computeFilteredRanks(filter);
  const _rankActiveSet = activeOnlySet();
  const filtered = _rankActiveSet ? _rankRaw.filter(r=>_rankActiveSet.has(r.name)) : _rankRaw;
  const months = availableMonths();
  const posC = ['#F0A500','#C0C0C0','#CD7F32'];
  const fmtT = n => {
    if (n%1===0) return `${n}`;
    const w=Math.floor(n);
    return w ? `${w}<span class="half-frac">½</span>` : `<span class="half-frac">½</span>`;
  };
  const fbtn = (type,val,label) => {
    const active=filter.type===type&&(type==='all'||filter.val===val);
    return `<button onclick="setRankFilter('${type}','${val===null?'':val}')"
      style="padding:5px 11px;border-radius:20px;border:1px solid ${active?'var(--accent)':'var(--border)'};
             background:${active?'#00d67f18':'none'};color:${active?'var(--accent)':'var(--text2)'};
             font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">${label}</button>`;
  };

  return `<div class="card">
    <div class="card-hdr"><span class="card-lbl">Ranking de Campeões</span></div>
    <div style="padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border2);align-items:center">
      ${['Todos','Ativos'].map((lbl,i)=>{const act=st.showInactive===(i===0);return`<button onclick="setShowInactive(${i===0})"
        style="padding:5px 11px;border-radius:20px;border:1px solid ${act?'var(--accent)':'var(--border)'};
               background:${act?'#00d67f18':'none'};color:${act?'var(--accent)':'var(--text2)'};
               font-size:12px;font-weight:600;cursor:pointer">${lbl}</button>`;}).join('')}
      <span style="width:1px;height:18px;background:var(--border2);margin:0 2px"></span>
      ${fbtn('all',null,'Geral')}
      ${fbtn('last',3,'Últimos 3')}
      ${fbtn('last',5,'Últimos 5')}
      ${fbtn('last',10,'Últimos 10')}
      <select onchange="setRankFilter('month',this.value)"
        style="padding:5px 10px;border-radius:20px;border:1px solid ${filter.type==='month'?'var(--accent)':'var(--border)'};
               background:${filter.type==='month'?'#00d67f18':'var(--s2)'};
               color:${filter.type==='month'?'var(--accent)':'var(--text2)'};
               font-size:12px;font-weight:600;cursor:pointer;outline:none">
        <option value="" ${filter.type!=='month'?'selected':''}>Por mês...</option>
        ${months.map(m=>`<option value="${m}" ${filter.type==='month'&&filter.val===m?'selected':''}>${fmtMonth(m)}</option>`).join('')}
      </select>
    </div>
    ${!filtered.length
      ? `<p style="padding:16px 14px;font-size:13px;color:var(--text3);text-align:center">Nenhum resultado para este filtro.</p>`
      : `<table class="rank-table">
          <thead><tr><th>#</th><th>Jogador</th><th>Títulos</th><th>Último</th></tr></thead>
          <tbody>
            ${filtered.map((p,i)=>`<tr class="${i<3?'top3':''}">
              <td class="td-pos"><span class="pos-num" style="color:${posC[i]||'#6e7681'}">${i+1}°</span></td>
              <td style="font-weight:600;font-size:15px">${p.name}</td>
              <td class="td-titles">${fmtT(p.titles)}</td>
              <td class="td-date">${fdt(p.last_date)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`}
  </div>

  ${(()=>{
    const fd=filteredDoneChamps();
    const {tally,artTitles}=computeGoalsRanking(fd);
    const byGoals=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const byArt=Object.entries(artTitles).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if(!byGoals.length) return '';
    const {tally:ftally,finalsScored}=computeFinalsGoalTally(fd);
    const byFinalGoals=Object.entries(ftally).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const byFinalsArt=Object.entries(computeFinalsArtilheiroRanking(fd)).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const rowFmt = (name,val,i,color) => `
      <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--border2)">
        <span style="font-size:11px;color:${posC[i]||'#6e7681'};font-weight:700;width:18px">${i+1}°</span>
        <span style="flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</span>
        <span style="font-weight:800;color:${color};font-size:15px">${val}</span>
      </div>`;
    return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="card">
        <div class="card-hdr"><span class="card-lbl">🥇 Artilheiro</span></div>
        ${byArt.length?byArt.map(([name,n],i)=>rowFmt(name,n,i,'var(--gold)')).join('')
        :`<p style="padding:12px;font-size:13px;color:var(--text3)">Nenhum</p>`}
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-lbl">🏆 Artilheiro da Final</span></div>
        ${byFinalsArt.length?byFinalsArt.map(([name,n],i)=>rowFmt(name,n,i,'var(--gold)')).join('')
        :`<p style="padding:12px;font-size:13px;color:var(--text3)">Nenhum</p>`}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="card">
        <div class="card-hdr"><span class="card-lbl">⚽ Gols (total)</span></div>
        ${byGoals.map(([name,g],i)=>rowFmt(name,g,i,'#4DB8FF')).join('')}
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-lbl">⚽ Gols Finais</span></div>
        ${byFinalGoals.length?byFinalGoals.map(([name,g],i)=>`
          <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--border2)">
            <span style="font-size:11px;color:${posC[i]||'#6e7681'};font-weight:700;width:18px">${i+1}°</span>
            <span style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
              <div style="font-size:10px;color:var(--text3)">${finalsScored[name]||0} final${(finalsScored[name]||0)!==1?'is':''}</div>
            </span>
            <span style="font-weight:800;color:#4DB8FF;font-size:15px">${g}</span>
          </div>`).join('')
        :`<p style="padding:12px;font-size:13px;color:var(--text3)">Nenhum</p>`}
      </div>
    </div>`;
  })()}`;
}

function vHistory() {
  if (!st.ready) return `<div class="loading"><div class="spinner"></div></div>`;
  const done = st.champs.filter(c=>c.status==='completed');

  if (st.histId) {
    const c = done.find(x=>x.id===st.histId);
    if (c) {
      const confirming = st.confirmDelete === c.id;
      const topBar = confirming
        ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
             <button class="btn btn-ghost btn-sm btn-inline" style="margin:0" onclick="st.histId=null;st.confirmDelete=null;render()">← Voltar</button>
             <span style="flex:1"></span>
             <span style="font-size:13px;color:var(--danger);font-weight:600">Excluir este campeonato?</span>
             <button class="btn btn-sm btn-inline" style="margin:0;background:var(--danger);color:#fff;border:none;padding:7px 14px" onclick="deleteChampionship('${c.id}')">Sim, excluir</button>
             <button class="btn btn-ghost btn-sm btn-inline" style="margin:0" onclick="st.confirmDelete=null;render()">Cancelar</button>
           </div>`
        : `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
             <button class="btn btn-ghost btn-sm btn-inline" style="margin:0" onclick="st.histId=null;render()">← Voltar</button>
             <span style="flex:1"></span>
             <button class="btn btn-sm btn-inline" style="margin:0;background:none;border:1px solid var(--danger);color:var(--danger);padding:7px 14px"
               onclick="st.confirmDelete='${c.id}';render()">🗑 Excluir</button>
           </div>`;
      return topBar + renderChamp(c, false);
    }
    st.histId=null;
  }

  if (!done.length) return `<div class="empty">
    <div class="ei">📅</div>
    <h3>Sem histórico</h3>
    <p>Campeonatos concluídos aparecerão aqui.</p>
  </div>`;

  return `<div class="card">
    <div class="card-hdr"><span class="card-lbl">Histórico</span></div>
    ${done.map(c=>{
      const ct=T[c.champion]||{l:c.champion,c:'#F0A500'};
      return `<div class="hist-row" onclick="st.histId='${c.id}';render()">
        <div class="hist-date">${fdt(c.date)}</div>
        <div class="hist-info">
          <div class="hist-teams">${c.teams.map(tl).join(' · ')} · ${c.format} times</div>
          <div class="hist-champ" style="color:${ct.c}">🏆 ${ct.l}</div>
        </div>
        <span class="hist-arrow">›</span>
      </div>`;
    }).join('')}
  </div>`;
}

function mScore() {
  const m=st.modal; if(m?.type!=='score') return '';
  const ht=T[m.home]||{l:m.home,c:'#8B949E'};
  const at=T[m.away]||{l:m.away,c:'#8B949E'};
  return `<div class="overlay" onclick="closeModal()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      ${(()=>{
        const champ = activeChamp();
        const rosters = champ?.teamRosters || {};
        const allActive = st.players.filter(p=>p.active!==false).map(p=>p.name);
        const homePlayers = rosters[st.modal?.home] || [];
        const awayPlayers = rosters[st.modal?.away] || [];
        const homeOthers = allActive.filter(n=>!homePlayers.includes(n));

      })()}

            <button class="step-btn" onclick="adj('hs',1)">+</button>
          </div>
        </div>
        <div class="score-x">×</div>
        <div class="score-team-col">
          <div class="score-team-nm" style="color:${at.c}">${at.l}</div>
          <div class="score-stepper">
            <button class="step-btn" onclick="adj('as',-1)">−</button>

const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function toast(msg, type='err') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ── ranking filter helpers ─────────────────────────────────── */
function fmtMonth(ym) {
  const [y,m]=ym.split('-');
  return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][+m-1]+'/'+y.slice(2);
}
function availableMonths() {
  return [...new Set(st.champs.filter(c=>c.status==='completed').map(c=>c.date.slice(0,7)))]
    .sort().reverse();
}
function filteredDoneChamps() {
  const f = st.rankFilter || {type:'all'};
  const all = st.champs.filter(c=>c.status==='completed').sort((a,b)=>a.date.localeCompare(b.date));
  if (f.type==='month' && f.val) return all.filter(c=>c.date.startsWith(f.val));
  if (f.type==='last' && f.val) return all.slice(-f.val);
  return all;
}

function computeFilteredRanks(filter) {
  if (!filter||filter.type==='all') return st.ranks;
  const done=st.champs.filter(c=>c.status==='completed').sort((a,b)=>a.date.localeCompare(b.date));
  let sub;
  if (filter.type==='month') sub=done.filter(c=>c.date.startsWith(filter.val));
  else if (filter.type==='last') sub=done.slice(-filter.val);
  else return st.ranks;
  const ids=new Set(sub.map(c=>c.id));
  const map={};
  for (const r of st.ranks) {
    const entries=(r.entries||[]).filter(e=>
      e.champId?ids.has(e.champId):sub.some(c=>c.date===e.date&&c.champion===e.team)
    );
    if (!entries.length) continue;
    const titles=entries.reduce((s,e)=>s+e.weight,0);
    const last_date=entries.reduce((ld,e)=>e.date>ld?e.date:ld,'');
    map[r.id]={id:r.id,name:r.name,titles,last_date};
  }
  return Object.values(map).sort((a,b)=>b.titles!==a.titles?b.titles-a.titles:a.last_date.localeCompare(b.last_date));
}
function setRankFilter(type,val) {
  const v=val===''||val==='null'||val===undefined?null:(isNaN(+val)?val:+val);
  st.rankFilter={type,val:v};
  render();
}

/* ── stats computations ─────────────────────────────────────── */
function computeStreaks(eligibleNames) {
  const done = st.champs.filter(c=>c.status==='completed')
    .sort((a,b)=>a.date.localeCompare(b.date));
  const all = {};
  for (const champ of done)
    for (const p of (champ.champion_players||[])) {
      const n=p.name.trim();
      if (n && (!eligibleNames||eligibleNames.has(n)) && !all[n])
        all[n]={cur:0,max:0,curStart:null,startDate:null,endDate:null};
    }
  done.forEach(champ => {
    const wMap={};
    for (const p of (champ.champion_players||[])) { const n=p.name.trim(); if(n) wMap[n]=p.weight||1; }
    for (const n of Object.keys(all)) {
      if (wMap[n]!==undefined) {
        if (all[n].cur===0) all[n].curStart=champ.date;
        all[n].cur+=wMap[n];
        if (all[n].cur>all[n].max) { all[n].max=all[n].cur; all[n].startDate=all[n].curStart; all[n].endDate=champ.date; }
      } else { all[n].cur=0; all[n].curStart=null; }
    }
  });
  return Object.entries(all).map(([name,s])=>({name,streak:s.max,startDate:s.startDate,endDate:s.endDate}))
    .filter(x=>x.streak>0).sort((a,b)=>b.streak-a.streak).slice(0,5);
}

function computeDroughts(eligibleNames) {
  const done = st.champs.filter(c=>c.status==='completed')
    .sort((a,b)=>a.date.localeCompare(b.date));
  const inactiveNames = new Set(st.players.filter(p=>p.active===false).map(p=>p.name.trim().toLowerCase()));
  const wins = {};
  done.forEach((champ,idx) => {
    for (const p of (champ.champion_players||[])) {
      const n=p.name.trim();
      if (!n || inactiveNames.has(n.toLowerCase()) || (eligibleNames && !eligibleNames.has(n))) continue;
      if (!wins[n]) wins[n]=[];
      wins[n].push(idx);
    }
  });
  const total=done.length, result=[];
  for (const [name,idxs] of Object.entries(wins)) {
    let max=0, startIdx=-1, endIdx=-1;
    for (let i=1;i<idxs.length;i++) {
      const gap=idxs[i]-idxs[i-1]-1;
      if (gap>max) { max=gap; startIdx=idxs[i-1]+1; endIdx=idxs[i]-1; }
    }
    const cur=total-1-idxs[idxs.length-1];
    if (cur>max) { max=cur; startIdx=idxs[idxs.length-1]+1; endIdx=total-1; }
    if (max>0) result.push({
      name, drought:max,
      current: total-1-idxs[idxs.length-1],
      startDate: startIdx>=0?done[startIdx].date:null,
      endDate:   endIdx>=0?done[endIdx].date:null,
    });
  }
  return result.sort((a,b)=>b.drought-a.drought);
}

function computeActiveStreaks(eligibleNames) {
  const done = st.champs.filter(c=>c.status==='completed')
    .sort((a,b)=>a.date.localeCompare(b.date));
  const all = {};
  for (const champ of done)
    for (const p of (champ.champion_players||[])) {
      const n=p.name.trim();
      if (n && (!eligibleNames||eligibleNames.has(n)) && !all[n]) all[n]={cur:0,startDate:null};
    }
  done.forEach(champ => {
    const wMap={};
    for (const p of (champ.champion_players||[])) { const n=p.name.trim(); if(n) wMap[n]=p.weight||1; }
    for (const n of Object.keys(all)) {
      if (wMap[n]!==undefined) { if(all[n].cur===0) all[n].startDate=champ.date; all[n].cur+=wMap[n]; }
      else { all[n].cur=0; all[n].startDate=null; }
    }
  });
  const lastDate = done.length ? done[done.length-1].date : null;
  return Object.entries(all)
    .filter(([,s])=>s.cur>0)
    .map(([name,s])=>({name,streak:s.cur,startDate:s.startDate,endDate:lastDate}))
    .sort((a,b)=>b.streak-a.streak).slice(0,5);
}

function computeActiveDroughts(eligibleNames) {
  const done = st.champs.filter(c=>c.status==='completed')
    .sort((a,b)=>a.date.localeCompare(b.date));
  const inactiveNames = new Set(st.players.filter(p=>p.active===false).map(p=>p.name.trim().toLowerCase()));
  const lastWin = {};
  done.forEach((champ,idx) => {
    for (const p of (champ.champion_players||[])) {
      const n=p.name.trim();
      if (!n || inactiveNames.has(n.toLowerCase()) || (eligibleNames && !eligibleNames.has(n))) continue;
      lastWin[n]=idx;
    }
  });
  const total=done.length, result=[];
  for (const [name,idx] of Object.entries(lastWin)) {
    const cur=total-1-idx;
    if (cur>0) result.push({name,drought:cur,startDate:done[idx+1]?.date||null,endDate:done[total-1]?.date||null});
  }
  return result.sort((a,b)=>b.drought-a.drought).slice(0,5);
}

function computeFullHalf(eligibleNames) {
  const full={}, half={};
  for (const r of st.ranks) {
    if (eligibleNames && !eligibleNames.has(r.name)) continue;
    for (const e of (r.entries||[])) {
      if (e.weight===1)   full[r.name]=(full[r.name]||0)+1;
      if (e.weight===0.5) half[r.name]=(half[r.name]||0)+1;
    }
  }
  return {
    full: Object.entries(full).sort((a,b)=>b[1]-a[1]).slice(0,5),
    half: Object.entries(half).sort((a,b)=>b[1]-a[1]).slice(0,5),
  };
}

function champGoalTally(champ) {
  const t={};
  for (const m of (champ.matches||[]))
    for (const g of (m.goals||[]))
      if(g.player) t[g.player]=(t[g.player]||0)+1;
  return t;
}

function champArtilheiros(champ) {
  const t=champGoalTally(champ);
  const entries=Object.entries(t);
  if(!entries.length) return [];
  const max=Math.max(...entries.map(([,v])=>v));
  return entries.filter(([,v])=>v===max).map(([name,goals])=>({name,goals}));
}

function computeFinalsGoalTally(doneChamps) {
  const tally = {}, finalsScored = {};
  for (const champ of (doneChamps || st.champs.filter(c => c.status === 'completed'))) {
    const fm = (champ.matches || []).find(m => m.phase === 'final' && m.played);
    if (!fm) continue;
    const goals = (fm.finalGoals && fm.finalGoals.length ? fm.finalGoals : fm.goals) || [];
    const inThis = new Set();
    for (const g of goals) {
      if (!g.player) continue;
      tally[g.player] = (tally[g.player] || 0) + 1;
      inThis.add(g.player);
    }
    for (const n of inThis) finalsScored[n] = (finalsScored[n] || 0) + 1;
  }
  return {tally, finalsScored};
}

function computeFinalsArtilheiroRanking(doneChamps) {
  const artTitles = {};
  for (const champ of (doneChamps || st.champs.filter(c => c.status === 'completed'))) {
    const fm = (champ.matches || []).find(m => m.phase === 'final' && m.played);
    if (!fm) continue;
    const goals = (fm.finalGoals && fm.finalGoals.length ? fm.finalGoals : fm.goals) || [];
    const t = {};
    for (const g of goals) { if (g.player) t[g.player] = (t[g.player] || 0) + 1; }
    if (!Object.keys(t).length) continue;
    const maxG = Math.max(...Object.values(t));
    for (const [n, g] of Object.entries(t)) if (g === maxG) artTitles[n] = (artTitles[n] || 0) + 1;
  }
  return artTitles;
}

function computeGoalDroughts() {
  const cutoff = '2026-09-08';
  const done = st.champs.filter(c=>c.status==='completed' && c.date>=cutoff)
    .sort((a,b)=>b.date.localeCompare(a.date));
  if (!done.length) return [];
  const {tally} = computeGoalsRanking();
  const result = [];
  for (const player of Object.keys(tally)) {
    let drought = 0;
    for (const champ of done) {
      const ct = champGoalTally(champ);
      if (ct[player]) break;
      drought++;
    }
    if (drought > 0) result.push({name: player, drought, total: done.length});
  }
  return result.sort((a,b)=>b.drought-a.drought).slice(0,10);
}

function computeSingleChampGoalRecords() {
  const records = [];
  for (const champ of st.champs.filter(c=>c.status==='completed')) {
    const tally = champGoalTally(champ);
    for (const [name, goals] of Object.entries(tally)) {
      records.push({name, goals, date: champ.date});
    }
  }
  return records.sort((a,b)=>b.goals-a.goals||a.date.localeCompare(b.date)).slice(0,10);
}

function computeGoalsRanking(doneChamps) {
  const tally={}, artTitles={};
  for (const champ of (doneChamps || st.champs.filter(c=>c.status==='completed'))) {
    const ct=champGoalTally(champ);
    for (const [n,g] of Object.entries(ct)) tally[n]=(tally[n]||0)+g;
    const maxG=Object.values(ct).reduce((a,b)=>Math.max(a,b),0);
    if(maxG>0) for (const [n,g] of Object.entries(ct)) if(g===maxG) artTitles[n]=(artTitles[n]||0)+1;
  }
  return {tally, artTitles};
}

function computeGoalsPerTitle() {
  const cutoff='2026-09-02';
  const data={};
  for (const champ of st.champs.filter(c=>c.status==='completed'&&c.date>cutoff)) {
    const ct=champGoalTally(champ);
    for (const p of (champ.champion_players||[])) {
      const n=p.name.trim(); if(!n) continue;
      if(!data[n]) data[n]={goals:0,titles:0};
      data[n].goals+=(ct[n]||0);
      data[n].titles+=(p.weight||1);
    }
  }
  return Object.entries(data)
    .filter(([,d])=>d.titles>0)
    .map(([name,d])=>({name,goals:d.goals,titles:d.titles,ratio:d.goals/d.titles}))
    .sort((a,b)=>b.ratio-a.ratio);
}

function analyzeClassification(champ) {
  const fmt = champ.format;
  if (fmt !== 4 && fmt !== 5) return null;
  const qualify = fmt === 4 ? 2 : 4;
  const regMs = champ.matches.filter(m => m.phase === 'regular');
  const unplayed = regMs.filter(m => !m.played && !m.rest);
  const roundsLeft = new Set(unplayed.map(m => m.round).filter(Boolean)).size;
  if (roundsLeft === 0 || roundsLeft > 2) return null;

  const st2 = standings(champ.teams, regMs.filter(m => m.played));
  const basePts = Object.fromEntries(st2.map(s => [s.team, s.pts]));
  const baseSG  = Object.fromEntries(st2.map(s => [s.team, s.gp - s.gc]));
  const teams = champ.teams;
  const n = unplayed.length;
  const total = Math.pow(3, n);

  const qualCount  = Object.fromEntries(teams.map(t => [t, 0]));
  const swData     = Object.fromEntries(teams.map(t => [t, { all: 0, qual: 0 }]));
  const noLossData = Object.fromEntries(teams.map(t => [t, { all: 0, qual: 0 }]));

  for (let mask = 0; mask < total; mask++) {
    const pts = { ...basePts };
    const wAll   = Object.fromEntries(teams.map(t => [t, true]));
    const noLoss = Object.fromEntries(teams.map(t => [t, true]));
    let tmp = mask;
    for (const m of unplayed) {
      const r = tmp % 3; tmp = Math.floor(tmp / 3);
      if (r === 0) {
        pts[m.home] += 3;
        wAll[m.away] = false; noLoss[m.away] = false;
      } else if (r === 1) {
        pts[m.home] += 1; pts[m.away] += 1;
        wAll[m.home] = false; wAll[m.away] = false;
      } else {
        pts[m.away] += 3;
        wAll[m.home] = false; noLoss[m.home] = false;
      }
    }
    const sorted = [...teams].sort((a, b) =>
      pts[b] !== pts[a] ? pts[b] - pts[a] : baseSG[b] - baseSG[a]
    );
    const qSet = new Set(sorted.slice(0, qualify));
    for (const t of teams) {
      if (qSet.has(t)) qualCount[t]++;
      if (wAll[t])   { swData[t].all++;     if (qSet.has(t)) swData[t].qual++;     }
      if (noLoss[t]) { noLossData[t].all++; if (qSet.has(t)) noLossData[t].qual++; }
    }
  }

  const icons = { classified:'✅', no_loss:'🟡', needs_wins:'🟡', draw_partial:'🟡', needs_help:'🟠', very_hard:'🔴', eliminated:'❌' };
  return {
    roundsLeft,
    qualify,
    teams: st2.map(s => {
      const t = s.team, c = qualCount[t], sw = swData[t], nl = noLossData[t];
      const rem = unplayed.filter(m => m.home === t || m.away === t).length;
      const noLossControls = nl.all > 0 && nl.qual === nl.all;
      const winsControls   = sw.all > 0 && sw.qual === sw.all;
      const drawSometimes  = nl.qual > 0 && nl.qual < nl.all; // empate ajuda em parte dos cenários
      const canWin = sw.qual > 0;
      let status, detail;
      if (c === total)              { status = 'classified';   detail = 'Classificado garantido'; }
      else if (c === 0)             { status = 'eliminated';   detail = 'Eliminado matematicamente'; }
      else if (noLossControls && rem === 0) { status = 'classified'; detail = 'Classificado garantido'; }
      else if (noLossControls)      { status = 'no_loss';      detail = rem === 1 ? 'Empate basta' : 'Não pode perder'; }
      else if (winsControls && drawSometimes && rem > 0) {
                                      status = 'draw_partial'; detail = rem === 1 ? 'Vencer garante · empate pode bastar' : 'Precisa vencer (empate pode bastar)'; }
      else if (winsControls)        { status = 'needs_wins';   detail = rem === 0 ? 'Depende de outros' : rem === 1 ? 'Precisa vencer o próximo' : `Precisa vencer os ${rem} jogos`; }
      else if (canWin)              { status = 'needs_help';   detail = rem === 0 ? 'Depende de outros resultados' : 'Precisa vencer e torcer'; }
      else                          { status = 'very_hard';    detail = 'Só com combinação favorável'; }
      return { team: t, status, detail, icon: icons[status], count: c, total };
    })
  };
}

function setStatsFilter(key, val) {
  st.statsFilter[key] = key==='minTitles' ? +val : val;
  if (key==='player' && val) st.statsFilter.minTitles=0;
  if (key==='minTitles' && +val>0) st.statsFilter.player='';
  render();
}
function setShowInactive(val) { st.showInactive=val; render(); }
function activeOnlySet() {
  const base = st.players.filter(p=>!p.somenteChurrasco);
  if (st.showInactive) return new Set(base.map(p=>p.name));
  return new Set(base.filter(p=>p.active!==false).map(p=>p.name));
}
function intersectSets(a,b) {
  if (!a) return b; if (!b) return a;
  return new Set([...a].filter(x=>b.has(x)));
}
