function drawEvoChart() {
  const canvas = document.getElementById('evo-chart');
  if (!canvas) return;
  const done = st.champs.filter(c=>c.status==='completed').sort((a,b)=>a.date.localeCompare(b.date));
  if (!done.length) return;

  const COLORS = ['#4DB8FF','#00d67f','#F5C842','#FF5C5C','#FF8A3C','#9EA7B3'];
  const f = st.statsFilter;
  const eligibleNames = f.player ? new Set([f.player])
    : f.minTitles>0 ? new Set(st.ranks.filter(r=>r.titles>=f.minTitles).map(r=>r.name))
    : null;
  const topRanks = eligibleNames
    ? st.ranks.filter(r=>eligibleNames.has(r.name)).slice(0,6)
    : st.ranks.slice(0,6);
  const top = topRanks.map(r=>r.name);
  const cum = Object.fromEntries(top.map(n=>[n,0]));
  const pts = done.map(champ => {
    for (const p of (champ.champion_players||[])) {
      const n=p.name.trim(); if(cum[n]!==undefined) cum[n]+=p.weight;
    }
    return {date:champ.date, ...cum};
  });

  const maxVal = Math.max(...top.map(n=>cum[n]),1);
  const W = canvas.parentElement.clientWidth - 28;
  canvas.width = W;
  const H=200, PAD={t:10,r:8,b:28,l:28};
  const cW=W-PAD.l-PAD.r, cH=H-PAD.t-PAD.b;
  const n=pts.length, xStep=n>1?cW/(n-1):cW;

  function draw(hi=-1) {
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,W,H);
    // Grid
    ctx.lineWidth=1;
    for(let i=0;i<=4;i++){
      const y=PAD.t+(cH/4)*i;
      ctx.strokeStyle='#21262d'; ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(PAD.l+cW,y); ctx.stroke();
      ctx.fillStyle='#6e7681'; ctx.font='10px Inter,system-ui'; ctx.textAlign='right';
      ctx.fillText(Math.round(maxVal-(maxVal/4)*i),PAD.l-4,y+3);
    }
    // Vertical highlight
    if (hi>=0) {
      const hx=PAD.l+(n>1?xStep*hi:cW/2);
      ctx.strokeStyle='#ffffff18'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(hx,PAD.t); ctx.lineTo(hx,PAD.t+cH); ctx.stroke();
    }
    // Lines + dots
    top.forEach((player,ci)=>{
      ctx.strokeStyle=COLORS[ci]; ctx.lineWidth=2; ctx.beginPath();
      pts.forEach((pt,i)=>{
        const x=PAD.l+(n>1?xStep*i:cW/2);
        const y=PAD.t+cH-((pt[player]||0)/maxVal)*cH;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.stroke();
      [n-1,hi].filter((v,i,a)=>v>=0&&a.indexOf(v)===i).forEach(di=>{
        const x=PAD.l+(n>1?xStep*di:cW/2);
        const y=PAD.t+cH-((pts[di][player]||0)/maxVal)*cH;
        ctx.fillStyle=COLORS[ci]; ctx.beginPath(); ctx.arc(x,y,di===hi?4:3,0,Math.PI*2); ctx.fill();
      });
    });
    // X labels
    ctx.fillStyle='#6e7681'; ctx.font='9px Inter,system-ui'; ctx.textAlign='center';
    const ls=Math.ceil(n/6);
    pts.forEach((pt,i)=>{
      if(i%ls===0||i===n-1){
        const x=PAD.l+(n>1?xStep*i:cW/2);
        const[,m,d]=pt.date.split('-');
        ctx.fillText(`${d}/${m}`,x,H-8);
      }
    });
  }

  draw();

  const tooltip = document.getElementById('chart-tooltip');
  if (!tooltip) return;

  function showAt(clientX) {
    const rect=canvas.getBoundingClientRect();
    let idx=Math.round((clientX-rect.left-PAD.l)/xStep);
    idx=Math.max(0,Math.min(n-1,idx));
    draw(idx);
    const pt=pts[idx];
    const[yr,mo,dy]=pt.date.split('-');
    let html=`<div style="font-weight:700;font-size:12px;margin-bottom:5px;color:var(--text)">${dy}/${mo}/${yr}</div>`;
    top.forEach((player,ci)=>{
      const val=pt[player]||0; if(!val) return;
      const fv=val%1===0?val:Math.floor(val)+'½';
      html+=`<div style="display:flex;align-items:center;gap:5px;margin-top:2px">
        <span style="width:7px;height:7px;border-radius:50%;background:${COLORS[ci]};flex-shrink:0"></span>
        <span style="flex:1;font-size:11px;color:var(--text2)">${player}</span>
        <span style="font-weight:700;font-size:12px;color:${COLORS[ci]}">${fv}</span>
      </div>`;
    });
    tooltip.innerHTML=html; tooltip.hidden=false;
    const hx=PAD.l+(n>1?xStep*idx:cW/2);
    const conW=canvas.parentElement.clientWidth;
    let left=hx+12; if(left+150>conW-14) left=hx-154;
    tooltip.style.left=Math.max(0,left)+'px';
    tooltip.style.top='8px';
  }

  canvas.onmousemove=e=>showAt(e.clientX);
  canvas.ontouchmove=e=>{e.preventDefault();showAt(e.touches[0].clientX);};
  canvas.onmouseleave=()=>{tooltip.hidden=true;draw();};
  canvas.ontouchend=()=>{tooltip.hidden=true;draw();};
}

function drawLineChart(canvasId, tooltipId, legendId, players, pts, colors) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !pts.length || !players.length) return;
  const tooltip = tooltipId ? document.getElementById(tooltipId) : null;
  const legendEl = legendId ? document.getElementById(legendId) : null;
  const maxVal = Math.max(...players.map(n=>pts[pts.length-1]?.[n]||0), 1);
  const W = canvas.parentElement.clientWidth - 28;
  if (W <= 0) return;
  canvas.width = W;
  const H = canvas.height, PAD={t:10,r:8,b:28,l:28};
  const cW=W-PAD.l-PAD.r, cH=H-PAD.t-PAD.b;
  const n=pts.length, xStep=n>1?cW/(n-1):cW;
  function draw(hi=-1) {
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<=4;i++){
      const y=PAD.t+(cH/4)*i;
      ctx.strokeStyle='#21262d'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(PAD.l+cW,y); ctx.stroke();
      ctx.fillStyle='#6e7681'; ctx.font='10px Inter,system-ui'; ctx.textAlign='right';
      ctx.fillText(String(Math.round(maxVal-(maxVal/4)*i)),PAD.l-4,y+3);
    }
    if (hi>=0) {
      const hx=PAD.l+(n>1?xStep*hi:cW/2);
      ctx.strokeStyle='#ffffff18'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(hx,PAD.t); ctx.lineTo(hx,PAD.t+cH); ctx.stroke();
    }
    players.forEach((player,ci)=>{
      ctx.strokeStyle=colors[ci]; ctx.lineWidth=2; ctx.beginPath();
      pts.forEach((pt,i)=>{
        const x=PAD.l+(n>1?xStep*i:cW/2);
        const y=PAD.t+cH-((pt[player]||0)/maxVal)*cH;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.stroke();
      [n-1,hi].filter((v,j,a)=>v>=0&&a.indexOf(v)===j).forEach(di=>{
        const x=PAD.l+(n>1?xStep*di:cW/2);
        const y=PAD.t+cH-((pts[di]?.[player]||0)/maxVal)*cH;
        ctx.fillStyle=colors[ci]; ctx.beginPath(); ctx.arc(x,y,di===hi?4:3,0,Math.PI*2); ctx.fill();
      });
    });
    ctx.fillStyle='#6e7681'; ctx.font='9px Inter,system-ui'; ctx.textAlign='center';
    const ls=Math.ceil(n/6);
    pts.forEach((pt,i)=>{
      if(i%ls===0||i===n-1){
        const x=PAD.l+(n>1?xStep*i:cW/2);
        const[,m,d]=pt.date.split('-');
        ctx.fillText(`${d}/${m}`,x,H-8);
      }
    });
  }
  draw();
  if (legendEl) legendEl.innerHTML=players.map((name,i)=>`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><span style="width:14px;height:3px;border-radius:2px;background:${colors[i]};display:inline-block"></span>${esc(name)}</span>`).join('');
  if (!tooltip) return;
  function showAt(clientX) {
    const rect=canvas.getBoundingClientRect();
    let idx=Math.round((clientX-rect.left-PAD.l)/xStep);
    idx=Math.max(0,Math.min(n-1,idx));
    draw(idx);
    const pt=pts[idx];
    const[yr,mo,dy]=pt.date.split('-');
    let html=`<div style="font-weight:700;font-size:12px;margin-bottom:5px;color:var(--text)">${dy}/${mo}/${yr}</div>`;
    players.forEach((player,ci)=>{
      const val=pt[player]||0; if(!val) return;
      html+=`<div style="display:flex;align-items:center;gap:5px;margin-top:2px"><span style="width:7px;height:7px;border-radius:50%;background:${colors[ci]};flex-shrink:0"></span><span style="flex:1;font-size:11px;color:var(--text2)">${player}</span><span style="font-weight:700;font-size:12px;color:${colors[ci]}">${val}</span></div>`;
    });
    tooltip.innerHTML=html; tooltip.hidden=false;
    const hx=PAD.l+(n>1?xStep*idx:cW/2);
    const conW=canvas.parentElement.clientWidth;
    let left=hx+12; if(left+150>conW-14) left=hx-154;
    tooltip.style.left=Math.max(0,left)+'px'; tooltip.style.top='8px';
  }
  canvas.onmousemove=e=>showAt(e.clientX);
  canvas.ontouchmove=e=>{e.preventDefault();showAt(e.touches[0].clientX);};
  canvas.onmouseleave=()=>{tooltip.hidden=true;draw();};
  canvas.ontouchend=()=>{tooltip.hidden=true;draw();};
}

function _buildChartPts(done, top, accumFn) {
  const cum=Object.fromEntries(top.map(n=>[n,0]));
  return done.map(champ=>{accumFn(champ,cum);return{date:champ.date,...cum};});
}

function getPaid(pagamentos, playerName, type) {
  const p = pagamentos[playerName];
  if (!p) return false;
  if (typeof p === 'boolean') return type === 'mensalidade' ? p : false;
  return !!(p[type]);
}

function daysInMonth(y, m) {
  return new Date(y, m, 0).getDate();
}

function getWeekdayOccurrences(y, m, diaSemana) {
  const dates = [];
  const dim = daysInMonth(y, m);
  for (let d = 1; d <= dim; d++) {
    if (new Date(y, m-1, d).getDay() === diaSemana)
      dates.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return dates;
}

function getDespMes(month) {
  const [y, mon] = month.split('-').map(Number);
  const entries = [];
  for (const d of (st.finDesp||[])) {
    if (!d.recorrencia) {
      if ((d.data||'').startsWith(month)) entries.push({...d, occKey: null});
    } else if (d.recorrencia === 'mensal') {
      const day = Math.min(d.diaDoMes||1, daysInMonth(y, mon));
      const data = `${month}-${String(day).padStart(2,'0')}`;
      const paga = (d.pagamentos||{})[month] === true;
      entries.push({...d, data, paga, occKey: month});
    } else if (d.recorrencia === 'semanal') {
      for (const date of getWeekdayOccurrences(y, mon, d.diaSemana||0)) {
        const paga = (d.pagamentos||{})[date] === true;
        entries.push({...d, data: date, paga, occKey: date});
      }
    }
  }
  return entries.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
}

  if (!st.ready) return `<div class="loading"><div class="spinner"></div></div>`;

  const fmtR = v => 'R$ ' + Number(v||0).toFixed(2).replace('.',',');

  let totalMens = 0, totalChurr = 0;
  for (const data of Object.values(st.finMens||{})) {
    const pags = data?.pagamentos || {};
    for (const pName of Object.keys(pags)) {
      if (getPaid(pags, pName, 'mensalidade')) totalMens += valM;
      if (getPaid(pags, pName, 'churrasco'))   totalChurr += valC;
    }
  }
  const totalAvulso = (st.finAvulsos||[]).filter(a=>a.paga!==false).reduce((s,a)=>s+(a.valor||0),0);
  const totalRec = totalMens + totalChurr + totalAvulso;
  const avulsosMes      = (st.finAvulsos||[]).filter(a=>(a.mes||'')==st.finMonth||(a.data||'').startsWith(st.finMonth));
  const avulsosMesPagas = avulsosMes.filter(a=>a.paga!==false).reduce((s,a)=>s+(a.valor||0),0);
  const avulsosMesPend  = avulsosMes.filter(a=>a.paga===false).reduce((s,a)=>s+(a.valor||0),0);

  const despOneTimePagas = (st.finDesp||[]).filter(d=>!d.recorrencia&&d.paga!==false).reduce((s,d)=>s+(d.valor||0),0);

  const curMon = new Date().toISOString().slice(0,7);

  for (const _d of (st.finDesp||[])) {

    while (sy < ey || (sy===ey && sm<=em)) {

      if (_d.recorrencia==='mensal') {
        const paid=(_d.pagamentos||{})[mon2]===true;
        if(paid) despRecPagas+=_d.valor||0; else despRecPend+=_d.valor||0;
      } else if (_d.recorrencia==='semanal') {
        for (const dt of getWeekdayOccurrences(sy,sm,_d.diaSemana||0)) {
          const paid=(_d.pagamentos||{})[dt]===true;
          if(paid) despRecPagas+=_d.valor||0; else despRecPend+=_d.valor||0;
        }
      }
      sm++; if(sm>12){sm=1;sy++;}
    }
  }
  const despPagas    = despOneTimePagas + despRecPagas;
  const despPendentes = despOneTimePend  + despRecPend;

async function addAvulso() {
  const m = st.modal;
  if (!m || !DB) return;
  if (!m.nome?.trim()) { toast('Informe o nome'); return; }
  if (!m.valor || +m.valor<=0) { toast('Informe um valor válido'); return; }
  try {
    await DB.collection('financeiro_avulsos').add({
      nome: m.nome.trim(),
      valor: +m.valor,
      data: today(),
      mes: st.finMonth,
      paga: false,
    });
    st.modal = null;
    render();
    toast('Avulso registrado!', 'ok');
  } catch(e) { toast('Erro: '+(e?.message||e)); }
}

async function toggleAvulsoPaga(id, current) {
  if (!DB) return;
  try {
    await DB.doc(`financeiro_avulsos/${id}`).update({paga: !current});
  } catch(e) { toast('Erro: '+(e?.message||e)); }
}

async function deleteAvulso(id) {
  if (!DB) return;
  try { await DB.doc(`financeiro_avulsos/${id}`).delete(); }
  catch(e) { toast('Erro: '+(e?.message||e)); }
}

        <label style="font-size:12px;font-weight:600;color:var(--text3);display:block;margin-bottom:5px">Saldo Inicial (R$)</label>
        <input type="number" step="0.01" value="${m.saldoInicial||0}"
          oninput="st.modal.saldoInicial=+this.value" style="${inp}">
        <p style="margin:5px 0 0;font-size:11px;color:var(--text3)">Dinheiro já existente antes de começar a usar o app.</p>
      </div>
      <button onclick="saveFinConfig()" style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#000;font-size:14px;font-weight:700;cursor:pointer">Salvar</button>
    </div>
  </div>`;
}

function prevFinMonth() {
  const [y,m] = st.finMonth.split('-').map(Number);
  const pm = m===1?12:m-1, py = m===1?y-1:y;
  st.finMonth = `${py}-${String(pm).padStart(2,'0')}`;
  render();
}

function nextFinMonth() {
  const [y,m] = st.finMonth.split('-').map(Number);
  const nm = m===12?1:m+1, ny = m===12?y+1:y;
  const next = `${ny}-${String(nm).padStart(2,'0')}`;
  if (next <= new Date().toISOString().slice(0,7)) { st.finMonth=next; render(); }
}

function togglePagamento(playerName, type) {
  if (!DB) return;
  const month = st.finMonth;
  const pags = st.finMens[month]?.pagamentos || {};
  const current = getPaid(pags, playerName, type);
  const existing = pags[playerName];
  let newVal;
  if (existing && typeof existing === 'object') {
    newVal = {...existing, [type]: !current};
  } else {
    newVal = {
      mensalidade: type==='mensalidade' ? !current : (existing===true),
      churrasco: type==='churrasco' ? !current : false,
    };
  }
  DB.doc(`financeiro_mensalidades/${month}`)
    .set({pagamentos:{[playerName]: newVal}},{merge:true})
    .catch(e=>toast('Erro: '+(e?.message||e)));
}

function togglePagamentoBoth(playerName) {
  if (!DB) return;
  const month = st.finMonth;
  const pags = st.finMens[month]?.pagamentos || {};
  const bothPaid = getPaid(pags, playerName, 'mensalidade') && getPaid(pags, playerName, 'churrasco');
  DB.doc(`financeiro_mensalidades/${month}`)
    .set({pagamentos:{[playerName]: {mensalidade: !bothPaid, churrasco: !bothPaid}}},{merge:true})
    .catch(e=>toast('Erro: '+(e?.message||e)));
}

async function uploadComprovante(id, file) {
  if (!file || !DB) return;
  try {
    toast('Enviando comprovante...');
    const url = await cloudinaryUpload(file);
    await DB.doc(`financeiro_despesas/${id}`).update({comprovante: url, comprovanteAt: today()});
    toast('Comprovante salvo!', 'ok');
  } catch(e) { toast('Erro: ' + (e?.message||e)); }
}

async function addDespesa() {
  const m = st.modal;
  if (!m) return;
  if (!m.descricao?.trim()) { toast('Informe a descrição'); return; }
  if (!m.valor || +m.valor<=0) { toast('Informe um valor válido'); return; }
  if (!DB) return;
  const rec = m.recorrencia || 'unica';
  if (rec==='semanal' && m.diaSemana==null) { toast('Selecione o dia da semana'); return; }
  try {
    const base = {
      descricao: m.descricao.trim(),
      valor: +m.valor,
      data: m.data || today(),
      categoria: m.categoria || 'Outro',
    };
    if (rec==='unica') {
      base.paga = false;
      if (m._file) {
        try {
          base.comprovante = await cloudinaryUpload(m._file);
          base.comprovanteAt = today();
        } catch(e) { toast('Aviso: comprovante não enviado — ' + (e?.message||e)); }
      }
    } else if (rec==='mensal') {
      base.recorrencia = 'mensal';
      base.diaDoMes = +m.diaDoMes || new Date(m.data||today()).getDate();
      base.pagamentos = {};
    } else if (rec==='semanal') {
      base.recorrencia = 'semanal';
      base.diaSemana = +m.diaSemana;
      base.pagamentos = {};
    }
    await DB.collection('financeiro_despesas').add(base);
    st.modal = null;
    render();
    toast('Despesa salva!', 'ok');
  } catch(e) { toast('Erro: '+(e?.message||e)); }
}

async function deleteDespesa(id) {
  if (!DB) return;
  if (!confirm('Excluir esta despesa? Esta ação não pode ser desfeita.')) return;
  try {
    await DB.doc(`financeiro_despesas/${id}`).delete();
    toast('Despesa removida');
  } catch(e) { toast('Erro: '+(e?.message||e)); }
}

async function deleteComprovante(id) {
  if (!DB) return;
  if (!confirm('Excluir o comprovante?')) return;
  try {
    await DB.doc(`financeiro_despesas/${id}`).update({
      comprovante: firebase.firestore.FieldValue.delete(),
      comprovanteAt: firebase.firestore.FieldValue.delete(),
    });
    toast('Comprovante removido.', 'ok');
  } catch(e) { toast('Erro: '+(e?.message||e)); }
}

async function saveFinConfig() {
  const m = st.modal;
  if (!m || !DB) return;
  try {
    await DB.doc('financeiro_config/main').set({
      valorMensalidade: +m.valorMensalidade || 0,
      valorChurrasco: +m.valorChurrasco || 0,
      reserva: +m.reserva || 0,
      saldoInicial: +m.saldoInicial || 0,
      valorAvulso: +m.valorAvulso || 0,
    });
    st.modal = null;
    render();
    toast('Configuração salva!', 'ok');
  } catch(e) { toast('Erro: '+(e?.message||e)); }
}

async function toggleDespesaPaga(id, current, occKey) {
  if (!DB) return;
  try {
    if (occKey) {
      await DB.doc(`financeiro_despesas/${id}`).update({[`pagamentos.${occKey}`]: !current});
    } else {
      await DB.doc(`financeiro_despesas/${id}`).update({paga: !current});
    }
  } catch(e) { toast('Erro: '+(e?.message||e)); }
}

/* ── event handlers ─────────────────────────────────────────── */
function nav(view) { st.view=view; st.histId=null; st.confirmDelete=null; render(); }

function onTkChg() {
  const ck=[...document.querySelectorAll('.tck:checked')].map(c=>c.value);
  document.querySelectorAll('.team-chk-label').forEach(el=>{
    const inp=el.querySelector('input'), id=inp.value;
    if(inp.checked){ el.style.borderColor=T[id].c; el.style.background=T[id].c+'18'; }
    else { el.style.borderColor=''; el.style.background=''; }
  });
  const hint=document.getElementById('fmthint'), btn=document.getElementById('dobtn');
  const desc={
    3:'🔄 <strong>Vira</strong> — quem ganha fica. Ao final, os 2 primeiros fazem a final.',
    4:'🔁 <strong>Todos contra todos</strong> em 2 turnos (12 jogos) + Final.',
    5:'📋 <strong>Fase de grupos</strong> 1 turno (10 jogos) + Semifinais + Final.',
  };
  const quick = document.getElementById('quick-reg')?.checked;
  const assignWrap = document.getElementById('player-assign-wrap');
  const assignInner = document.getElementById('player-assign-inner');
  if(ck.length>=3&&ck.length<=5){
    hint.innerHTML=desc[ck.length]; hint.style.display='block';
    btn.style.display='block';
    btn.textContent = quick ? `Registrar Campeonato` : `Criar com ${ck.length} Times`;
    const sel=document.getElementById('champ-team-sel');
    if(sel) sel.innerHTML=ck.map(t=>`
      <label style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
                    border:1.5px solid ${T[t].c}30;background:${T[t].c}0d;cursor:pointer;margin-bottom:6px">
        <input type="radio" name="champteam" value="${t}" style="accent-color:${T[t].c};width:16px;height:16px;cursor:pointer">
        <span style="width:10px;height:10px;border-radius:50%;background:${T[t].c};flex-shrink:0"></span>
        <span style="color:${T[t].c};font-weight:600;font-size:14px">${T[t].l}</span>
      </label>`).join('');
    if(assignWrap) assignWrap.style.display='block';
    if(assignInner) assignInner.innerHTML=renderPlayerAssignInner(ck);
  } else {
    hint.style.display='none'; btn.style.display='none';
    if(assignWrap) assignWrap.style.display='none';
    if(assignInner) assignInner.innerHTML='';
  }
}

function onQuickChg() {
  const checked = document.getElementById('quick-reg')?.checked;
  const qd = document.getElementById('quick-champ');
  if(qd) qd.style.display = checked ? 'block' : 'none';
  const ck=[...document.querySelectorAll('.tck:checked')];
  const btn = document.getElementById('dobtn');
  if(btn && ck.length>=3 && ck.length<=5)
    btn.textContent = checked ? 'Registrar Campeonato' : `Criar com ${ck.length} Times`;
}

function doCreate() {
  const ck=[...document.querySelectorAll('.tck:checked')].map(c=>c.value);
  if(ck.length<3||ck.length>5) return;
  const date = document.getElementById('champ-date')?.value || today();
  const quick = document.getElementById('quick-reg')?.checked;
  if(quick) {
    const champTeam = document.querySelector('input[name="champteam"]:checked')?.value;
    if(!champTeam){ toast('Selecione o time campeão.'); return; }
    createHistoricalChamp(ck, date, champTeam);
  } else {
    createChampionship(ck, date);
  }
}

function openScore(matchId) {
  const c=activeChamp(); if(!c) return;
  const m=c.matches.find(x=>x.id===matchId); if(!m||m.played) return;
  st.modal={type:'score',id:matchId,home:m.home,away:m.away,phase:m.phase,hs:0,as:0,homeGoals:[],awayGoals:[]};
  render();
}

function editScore(matchId) {
  const c=activeChamp(); if(!c) return;
  const m=c.matches.find(x=>x.id===matchId); if(!m||!m.played) return;
  const homeGoals=(m.goals||[]).filter(g=>g.team==='home').map(g=>g.player);
  const awayGoals=(m.goals||[]).filter(g=>g.team==='away').map(g=>g.player);
  st.modal={type:'score',id:matchId,home:m.home,away:m.away,phase:m.phase,
            hs:m.hs,as:m.as,homeGoals,awayGoals,editing:true};
  render();
}

function adj(field, delta) {
  if(st.modal?.type!=='score') return;
  const newVal=Math.max(0,st.modal[field]+delta);
  if(field==='hs'){
    if(newVal>st.modal.hs) st.modal.homeGoals.push('');
    else if(newVal<st.modal.hs) st.modal.homeGoals.pop();
  } else {
    if(newVal>st.modal.as) st.modal.awayGoals.push('');
    else if(newVal<st.modal.as) st.modal.awayGoals.pop();
  }
  st.modal[field]=newVal;
  const el=document.getElementById(`sv-${field}`);
  if(el) el.textContent=newVal;
  const gs=document.getElementById('goals-section');
  if(gs) gs.innerHTML=renderGoalsInputs();
}

function renderGoalsInputs() {
  const m=st.modal;
  if(!m||m.type!=='score'||(!m.hs&&!m.as)) return '';
  const ht=T[m.home]||{l:m.home,c:'#8B949E'};
  const at=T[m.away]||{l:m.away,c:'#8B949E'};
  let h=`<div style="border-top:1px solid var(--border2);padding-top:10px;margin-top:4px">
    <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:10px">Gols (opcional)</div>`;
  if(m.homeGoals.length){
    h+=`<div style="font-size:12px;color:${ht.c};font-weight:700;margin-bottom:6px">${ht.l}</div>`;
    m.homeGoals.forEach((g,i)=>{
      h+=`<input class="player-input" type="text" list="playerlist-home" placeholder="Artilheiro ${i+1}" value="${esc(g)}"
        oninput="st.modal.homeGoals[${i}]=this.value" style="margin-bottom:6px">`;
    });
  }
  if(m.awayGoals.length){
    h+=`<div style="font-size:12px;color:${at.c};font-weight:700;margin-bottom:6px${m.homeGoals.length?';margin-top:10px':''}">${at.l}</div>`;
    m.awayGoals.forEach((g,i)=>{
      h+=`<input class="player-input" type="text" list="playerlist-away" placeholder="Artilheiro ${i+1}" value="${esc(g)}"
        oninput="st.modal.awayGoals[${i}]=this.value" style="margin-bottom:6px">`;
    });
  }
  h+='</div>';
  return h;
}

function confirmScore() {
  const m=st.modal; if(m?.type!=='score') return;
  if((m.phase==='final'||m.phase==='semifinal')&&m.hs===m.as){
    toast('Nas fases eliminatórias é preciso um vencedor. Ajuste o placar.'); return;
  }
  const goals=[
    ...(m.homeGoals||[]).filter(g=>g.trim()).map(g=>({player:g.trim(),team:'home'})),
    ...(m.awayGoals||[]).filter(g=>g.trim()).map(g=>({player:g.trim(),team:'away'})),
  ];
  submitScore(m.id,m.hs,m.as,goals);
}

function openFinalGoalsEdit(champId, matchId) {
  const champ = st.champs.find(c => c.id === champId);
  if (!champ) return;
  const m = champ.matches.find(x => x.id === matchId);
  if (!m || m.phase !== 'final' || !m.played) return;
  const existing = (m.finalGoals && m.finalGoals.length ? m.finalGoals : m.goals) || [];
  const homeGoals = existing.filter(g => g.team === 'home').map(g => g.player||'');
  const awayGoals = existing.filter(g => g.team === 'away').map(g => g.player||'');
  while (homeGoals.length < (m.hs||0)) homeGoals.push('');
  while (awayGoals.length < (m.as||0)) awayGoals.push('');
  st.modal = {type:'finalGoals', champId, matchId, home:m.home, away:m.away, hs:m.hs||0, as:m.as||0, homeGoals, awayGoals};
  render();
}

async function submitFinalGoals() {
  const m = st.modal; if (m?.type !== 'finalGoals') return;
  const goals = [
    ...(m.homeGoals||[]).filter(n=>n.trim()).map(n=>({player:n.trim(),team:'home'})),
    ...(m.awayGoals||[]).filter(n=>n.trim()).map(n=>({player:n.trim(),team:'away'})),
  ];
  if (!DB) return;
  const champ = st.champs.find(c => c.id === m.champId); if (!champ) return;
  try {
    const matches = champ.matches.map(x => x.id === m.matchId ? {...x, finalGoals: goals} : {...x});
    await DB.doc(`championships/${m.champId}`).update({matches});
    st.modal = null; render(); toast('Gols da final salvos!', 'ok');
  } catch(e) { toast('Erro ao salvar: ' + (e?.message||e)); }
}

function mFinalGoals() {
  const m = st.modal; if (m?.type !== 'finalGoals') return '';
  const ht = T[m.home]||{l:m.home,c:'#8B949E'};
  const at = T[m.away]||{l:m.away,c:'#8B949E'};
  const champ = st.champs.find(c => c.id === m.champId);
  const rosters = champ?.teamRosters || {};
  const allActive = st.players.filter(p=>p.active!==false).map(p=>p.name);
  const buildList = (teamId, others) => {
    const team = rosters[teamId] || [];
    const rest = allActive.filter(n=>!team.includes(n));
    return `<datalist id="fg-${teamId}">${[...team,...rest].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
  };
  let rows = '';
  if (m.homeGoals.length) {
    rows += `<div style="font-size:12px;color:${ht.c};font-weight:700;margin-bottom:6px">${ht.l}</div>`;
    m.homeGoals.forEach((g,i) => {
      rows += `<input class="player-input" type="text" list="fg-${m.home}" placeholder="Marcador ${i+1}" value="${esc(g)}"
        oninput="st.modal.homeGoals[${i}]=this.value" style="margin-bottom:6px">`;
    });
  }
  if (m.awayGoals.length) {
    rows += `<div style="font-size:12px;color:${at.c};font-weight:700;margin-bottom:6px${m.homeGoals.length?';margin-top:10px':''}">${at.l}</div>`;
    m.awayGoals.forEach((g,i) => {
      rows += `<input class="player-input" type="text" list="fg-${m.away}" placeholder="Marcador ${i+1}" value="${esc(g)}"
        oninput="st.modal.awayGoals[${i}]=this.value" style="margin-bottom:6px">`;
    });
  }
  if (!m.homeGoals.length && !m.awayGoals.length)
    rows = `<p style="font-size:13px;color:var(--text3);text-align:center;padding:8px 0">Placar 0 × 0 — nenhum marcador</p>`;
  return `<div class="overlay" onclick="closeModal()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      ${buildList(m.home)} ${buildList(m.away)}
      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:13px;font-weight:700;margin-bottom:2px">⚽ Gols da Final</div>
        <div style="font-size:11px;color:var(--text3)">Salvo em artilharia das finais apenas — não altera artilharia geral</div>
        <div style="font-size:13px;margin-top:6px"><span style="color:${ht.c};font-weight:700">${ht.l}</span> <strong>${m.hs}</strong> × <strong>${m.as}</strong> <span style="color:${at.c};font-weight:700">${at.l}</span></div>
      </div>
      <div style="border-top:1px solid var(--border2);padding-top:10px;margin-bottom:10px">${rows}</div>
      <button class="btn btn-primary" onclick="submitFinalGoals()">Salvar Gols da Final</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>
  </div>`;
}

function closeModal() { st.modal=null; render(); }

function confirmEnd() { endRegular(); }

function openChampModal() {
  const c=activeChamp(); if(!c) return;
  const chmpTeam=champion(c.matches); if(!chmpTeam) return;
  st.modal={type:'champion',champion:chmpTeam,players:defPlayers()};
  render();
}

function upP(i,field,val) {
  if(!st.modal?.players) return;
  st.modal.players[i][field]=val;
  if(field==='name') return;
  const r=document.getElementById('modal-root');
  if(r) r.innerHTML=mScore()+mChamp();
}

function addP() {
  if(!st.modal?.players) return;
  st.modal.players.push({name:'',weight:1});
  const r=document.getElementById('modal-root');
  if(r) r.innerHTML=mScore()+mChamp();
}

function nextPlayerInput(i) {
  const inputs = document.querySelectorAll('#plist .player-input');
  if (i + 1 < inputs.length) {
    inputs[i+1].focus();
  } else {
    addP();
    requestAnimationFrame(() => {
      const all = document.querySelectorAll('#plist .player-input');
      if (all.length) all[all.length-1].focus();
    });
  }
}

/* ── init ────────────────────────────────────────────────────── */
render();
initFirebase();
</script>
