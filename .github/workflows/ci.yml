name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checar sintaxe do index.html
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
            let m, i = 0;
            while ((m = re.exec(html))) {
              i++;
              fs.writeFileSync('/tmp/inline-' + i + '.js', m[1]);
            }
            console.log('blocos inline encontrados:', i);
            if (i === 0) { console.error('nenhum bloco <script> inline encontrado'); process.exit(1); }
          "
          for f in /tmp/inline-*.js; do
            echo "Checando $f"
            node --check "$f"
          done

      - name: Instalar dependências das Cloud Functions
        working-directory: functions
        run: npm install

      - name: Checar sintaxe das Cloud Functions
        working-directory: functions
        run: node --check index.js

      - name: Testes das Cloud Functions (callables e triggers)
        working-directory: functions
        run: node test/members-test.js

      - name: Testes das Cloud Functions (notificações)
        working-directory: functions
        run: node test/functions-test.js

      - name: Testes das Cloud Functions (plano free e backup)
        working-directory: functions
        run: node test/free-mode-test.js

      - name: Testes das Cloud Functions (ligas abandonadas)
        working-directory: functions
        run: node test/abandoned-leagues-test.js

      - name: Testes das Cloud Functions (pagamento via Mercado Pago)
        working-directory: functions
        run: node test/payments-test.js

      - name: Testes das Cloud Functions (encerrar liga)
        working-directory: functions
        run: node test/delete-league-test.js

      - name: Testes das Cloud Functions (avisos de cobrança por e-mail)
        working-directory: functions
        run: node test/billing-emails-test.js

      - name: Testes dos ambientes (produção x teste)
        working-directory: functions
        run: node test/environments-test.js

      - name: Testes do atalho de segredos do ambiente de teste
        working-directory: functions
        run: node test/staging-secret-test.js

      - name: Testes da tradução dos erros do Mercado Pago
        working-directory: functions
        run: node test/mp-errors-test.js

      - name: Testes do app instalável e da prévia do link (ícones, manifesto, etiquetas)
        working-directory: functions
        run: node test/pwa-assets-test.js

      - name: Testes do app (confirmação automática do pagamento)
        working-directory: functions
        run: node test/client-payment-test.js

      - name: Testes do app (faixa do plano e avisos do teste grátis)
        working-directory: functions
        run: node test/client-plan-banner-test.js

      - name: Testes das métricas do funil (cálculo)
        working-directory: functions
        run: node test/funnel-metrics-test.js

      - name: Testes das métricas do funil (funções e contadores)
        working-directory: functions
        run: node test/metrics-functions-test.js

      - name: Testes do app (botão Instalar o app)
        working-directory: functions
        run: node test/client-install-test.js

      - name: Testes do app (painel do dono e contadores de uso)
        working-directory: functions
        run: node test/client-owner-metrics-test.js

      - name: Testes do app (cartão do jogador)
        working-directory: functions
        run: node test/client-card-test.js

      - name: Testes do app (encerrar liga)
        working-directory: functions
        run: node test/client-close-league-test.js

  # Regras do Firestore (firestore.rules) e Cloud Functions de verdade, nos emuladores do Firebase:
  # o que cada tipo de conta consegue ler e gravar direto no banco, e o que cada função faz com
  # tokens de login. Nada toca o Firebase real (projeto demo-aceoma). Ver functions/test/run-emulators.js.
  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O emulador do Firestore é um programa Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.28.2

      - name: Instalar dependências das Cloud Functions
        working-directory: functions
        run: npm install

      - name: Testes de ponta a ponta nos emuladores (regras e funções)
        working-directory: functions
        run: npm run test:emulators
