function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.textContent = msg;
  if (cls) line.className = cls;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function runSeed() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';

  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    log('Conectado ao Firebase.');

    // Championships
    const champs = DATA.championships;
    const champIds = Object.keys(champs);
    log('Importando ' + champIds.length + ' campeonatos...');
    for (const id of champIds) {
      try {
        await db.doc('championships/' + id).set(champs[id]);
        log('  ✓ ' + id + ' (' + (champs[id].date || '?') + ')', 'ok');
      } catch(e) {
        log('  ✗ ' + id + ': ' + e.message, 'err');
      }
    }

    // Player titles
    const titles = DATA.player_titles;
    const titleIds = Object.keys(titles);
    log('Importando ' + titleIds.length + ' jogadores...');
    for (const id of titleIds) {
      try {
        await db.doc('player_titles/' + id).set(titles[id]);
        log('  ✓ ' + titles[id].name + ' (' + titles[id].titles + ' título(s))', 'ok');
      } catch(e) {
        log('  ✗ ' + id + ': ' + e.message, 'err');
      }
    }

    log('');
    log('Importação concluída! Pode fechar esta página.', 'ok');
  } catch(e) {
    log('Erro: ' + e.message, 'err');
    btn.disabled = false;
  }
}
